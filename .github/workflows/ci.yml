name: CI

# Runs scripts/check.sh, the one gate script, on every pull request and on pushes
# to main, across the supported Python versions. Two more jobs run the offline
# suite outside the lock file: at the lowest versions pyproject.toml allows, and
# without any extra. The Release workflow calls this workflow, so a release
# passes exactly these checks before anything is published.

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev --group docs --all-extras

      - name: Run every gate
        run: scripts/check.sh

  lowest-versions:
    # The lock file pins the newest versions, so the gates never see the lower
    # bounds in pyproject.toml. This job resolves every direct dependency to the
    # lowest version its bound allows and runs the offline suite there.
    # UV_RESOLUTION applies to every uv command, so no later command re-locks.
    runs-on: ubuntu-latest
    env:
      UV_RESOLUTION: lowest-direct
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"

      - name: Install the lowest direct versions, with every extra
        run: uv sync --group dev --all-extras

      - name: Run the offline suite
        run: uv run --no-sync pytest -q

  without-extras:
    # The package and its offline suite must work with no extra installed.
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies without any extra
        run: uv sync --locked --group dev

      - name: Run the offline suite
        run: uv run --no-sync pytest -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository, with its whole history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # A pinned gitleaks release, checked against its published SHA-256, so
      # no third-party action or image runs with the repository's token.
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan the history for secrets
        run: ./gitleaks git . --config .gitleaks.toml --redact --verbose --no-banner
