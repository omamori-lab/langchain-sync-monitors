<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
  <title id="title">Trusted Monitoring, one step</title>
  <desc id="desc">The agent&#x27;s model proposes one step, and the monitor, drawn as an omamori charm, reads it through its view and scores it from 0 to 1. The step runs as proposed whatever the score, and its outcome is allowed. A score below audit_threshold leaves the step unflagged; a score at or above audit_threshold flags it for a person to review. Either way the step is sampled once, and one record joins monitor_log.</desc>
  <!-- Colours come from the brand tokens: diagrams/render.py fills this style block. -->
  <style>
    svg { color-scheme: dark; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "Noto Sans JP", Helvetica, Arial, sans-serif; font-size: 15px; fill: #ECEBE6; }
    .title { font-size: 17px; font-weight: 600; }
    .small { font-size: 14px; fill: #A9A8A2; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13.5px; }
    .soft { fill: #A9A8A2; }
    .dashed { stroke-dasharray: 5 4; fill: none; stroke: #6A6A66; }
    .box { fill: #141414; stroke: #ECEBE6; stroke-width: 1.4; }
    .charm { fill: #ECEBE6; }
    .on-charm { fill: #111111; }
    .charm-cord { fill: none; stroke: #ECEBE6; stroke-width: 2.2; }
    .seal { fill: #E0563B; }
    .allow { fill: #141414; stroke: #ECEBE6; stroke-width: 1.4; }
    .resample { fill: #1F1F1E; stroke: #ECEBE6; stroke-width: 1.4; }
    .defer { fill: #34332F; stroke: #ECEBE6; stroke-width: 1.4; }
    .steer { fill: #D9D8D2; stroke: #D9D8D2; stroke-width: 1.4; }
    .on-steer { fill: #111111; }
    .halt { fill: #E0563B; stroke: #E0563B; stroke-width: 1.4; }
    .on-halt { fill: #111111; }
    .frame { fill: none; stroke: #6A6A66; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .edge { fill: none; stroke: #D6D5CF; stroke-width: 1.5; }
    .loop { fill: none; stroke: #D6D5CF; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .head { fill: #D6D5CF; }
    .brush { fill: #ECEBE6; }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker></defs>
  <text x="32.0" y="44.0" text-anchor="start"><tspan class="title">Trusted Monitoring: every step runs</tspan></text>
  <rect class="box" x="32.0" y="159.0" width="236.0" height="102.0" rx="6"/>
  <text x="150.0" y="190.0" text-anchor="middle" class="title">Agent&#x27;s model</text>
  <text x="150.0" y="212.0" text-anchor="middle" class="small">proposes one step:</text>
  <text x="150.0" y="233.0" text-anchor="middle" class="small">tool calls and text</text>
  <path class="charm-cord" d="M462.0,160.0 C458.0,143.0 478.0,143.0 474.0,160.0"/>
  <path class="charm" d="M362.0,159.0 H574.0 L590.0,175.0 V255.0 Q590.0,261.0 584.0,261.0 H352.0 Q346.0,261.0 346.0,255.0 V175.0 Z"/>
  <rect class="seal" x="355.0" y="243.0" width="9" height="9" rx="1"/>
  <text x="468.0" y="190.0" text-anchor="middle" class="title on-charm">Monitor</text>
  <text x="468.0" y="212.0" text-anchor="middle" class="small on-charm">reads it through its view</text>
  <text x="468.0" y="233.0" text-anchor="middle" class="small on-charm">and scores it from 0 to 1</text>
  <path class="edge" d="M268.0,210.0 L344.0,210.0" marker-end="url(#arrow)"/>
  <text x="307.0" y="198.0" text-anchor="middle" class="small">proposal</text>
  <rect class="allow" x="668.0" y="96.0" width="300.0" height="102.0" rx="6"/>
  <text x="818.0" y="127.0" text-anchor="middle" class="title">The step runs</text>
  <text x="818.0" y="149.0" text-anchor="middle"><tspan class="small">below </tspan><tspan class="mono">audit_threshold</tspan><tspan class="small">:</tspan></text>
  <text x="818.0" y="170.0" text-anchor="middle"><tspan class="mono">allowed</tspan></text>
  <rect class="allow" x="668.0" y="222.0" width="300.0" height="102.0" rx="6"/>
  <text x="818.0" y="253.0" text-anchor="middle" class="title">The step runs, flagged</text>
  <text x="818.0" y="275.0" text-anchor="middle"><tspan class="small">at or above </tspan><tspan class="mono">audit_threshold</tspan><tspan class="small">:</tspan></text>
  <text x="818.0" y="296.0" text-anchor="middle"><tspan class="mono">allowed</tspan><tspan class="small">, for review</tspan></text>
  <path class="edge" d="M590.0,210.0 L628.0,210.0"/>
  <path class="edge" d="M628.0,147.0 L628.0,273.0"/>
  <path class="edge" d="M628.0,147.0 L666.0,147.0" marker-end="url(#arrow)"/>
  <path class="edge" d="M628.0,273.0 L666.0,273.0" marker-end="url(#arrow)"/>
  <text x="32.0" y="368.0" text-anchor="start"><tspan class="small">Each step is sampled once and always runs, and one record joins </tspan><tspan class="mono">monitor_log</tspan><tspan class="small">.</tspan></text>
</svg>
