<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="391" viewBox="0 0 1000 391" role="img" aria-labelledby="title desc">
  <title id="title">A fast monitor in front of a careful one</title>
  <desc id="desc">CascadeMonitor runs the fast monitor, such as a calibrated decision model, on every step. When the fast suspicion is below escalate_at, the fast verdict stands, its reason included. At or above escalate_at, the careful monitor, such as a calibrated, repeated chat judge, scores the step, and its verdict, reason included, replaces the fast one. The careful monitor runs on escalated steps only.</desc>
  <!-- Colours come from the brand tokens: diagrams/render.py fills this style block. -->
  <style>
    svg { color-scheme: light; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "Noto Sans JP", Helvetica, Arial, sans-serif; font-size: 15px; fill: #111111; }
    .title { font-size: 17px; font-weight: 600; }
    .small { font-size: 14px; fill: #5B5B57; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13.5px; }
    .soft { fill: #5B5B57; }
    .dashed { stroke-dasharray: 5 4; fill: none; stroke: #9A9A94; }
    .box { fill: #FFFFFF; stroke: #111111; stroke-width: 1.4; }
    .charm { fill: #111111; }
    .on-charm { fill: #FFFFFF; }
    .charm-cord { fill: none; stroke: #111111; stroke-width: 2.2; }
    .seal { fill: #BF3A22; }
    .allow { fill: #FFFFFF; stroke: #111111; stroke-width: 1.4; }
    .resample { fill: #F2F1EC; stroke: #111111; stroke-width: 1.4; }
    .defer { fill: #DCDBD4; stroke: #111111; stroke-width: 1.4; }
    .steer { fill: #3A3A38; stroke: #3A3A38; stroke-width: 1.4; }
    .on-steer { fill: #FFFFFF; }
    .halt { fill: #BF3A22; stroke: #BF3A22; stroke-width: 1.4; }
    .on-halt { fill: #FFFFFF; }
    .frame { fill: none; stroke: #9A9A94; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .edge { fill: none; stroke: #2B2B2B; stroke-width: 1.5; }
    .loop { fill: none; stroke: #2B2B2B; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .head { fill: #2B2B2B; }
    .brush { fill: #111111; }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker></defs>
  <text x="32.0" y="44.0" text-anchor="start"><tspan class="title">A fast monitor in front of a careful one</tspan></text>
  <text x="32.0" y="70.0" text-anchor="start"><tspan class="mono">CascadeMonitor</tspan><tspan class="small"> compares the fast suspicion with </tspan><tspan class="mono">escalate_at</tspan><tspan class="small">.</tspan></text>
  <path class="charm-cord" d="M379.0,113.0 C375.0,96.0 395.0,96.0 391.0,113.0"/>
  <path class="charm" d="M266.0,112.0 H504.0 L520.0,128.0 V208.0 Q520.0,214.0 514.0,214.0 H256.0 Q250.0,214.0 250.0,208.0 V128.0 Z"/>
  <rect class="seal" x="259.0" y="196.0" width="9" height="9" rx="1"/>
  <text x="385.0" y="143.0" text-anchor="middle" class="title on-charm">Fast monitor</text>
  <text x="385.0" y="165.0" text-anchor="middle" class="small on-charm">on every step, such as a</text>
  <text x="385.0" y="186.0" text-anchor="middle" class="small on-charm">calibrated decision model</text>
  <path class="charm-cord" d="M802.0,113.0 C798.0,96.0 818.0,96.0 814.0,113.0"/>
  <path class="charm" d="M664.0,112.0 H952.0 L968.0,128.0 V208.0 Q968.0,214.0 962.0,214.0 H654.0 Q648.0,214.0 648.0,208.0 V128.0 Z"/>
  <rect class="seal" x="657.0" y="196.0" width="9" height="9" rx="1"/>
  <text x="808.0" y="143.0" text-anchor="middle" class="title on-charm">Careful monitor</text>
  <text x="808.0" y="165.0" text-anchor="middle" class="small on-charm">on escalated steps only, such as</text>
  <text x="808.0" y="186.0" text-anchor="middle" class="small on-charm">a calibrated, repeated chat judge</text>
  <rect class="box" x="32.0" y="122.5" width="176.0" height="81.0" rx="6"/>
  <text x="120.0" y="153.5" text-anchor="middle" class="title">Proposed step</text>
  <text x="120.0" y="175.5" text-anchor="middle" class="small">and the transcript</text>
  <path class="edge" d="M208.0,163.0 L248.0,163.0" marker-end="url(#arrow)"/>
  <path class="edge" d="M520.0,163.0 L646.0,163.0" marker-end="url(#arrow)"/>
  <text x="584.0" y="153.0" text-anchor="middle" class="small">at or above</text>
  <text x="584.0" y="187.0" text-anchor="middle"><tspan class="mono">escalate_at</tspan></text>
  <rect class="box" x="250.0" y="278.0" width="270.0" height="81.0" rx="6"/>
  <text x="385.0" y="309.0" text-anchor="middle" class="title">The fast verdict stands</text>
  <text x="385.0" y="331.0" text-anchor="middle" class="small">its suspicion and its reason</text>
  <rect class="box" x="648.0" y="278.0" width="320.0" height="81.0" rx="6"/>
  <text x="808.0" y="309.0" text-anchor="middle" class="title">The careful verdict replaces it</text>
  <text x="808.0" y="331.0" text-anchor="middle" class="small">its reason included</text>
  <path class="edge" d="M385.0,214.0 L385.0,276.0" marker-end="url(#arrow)"/>
  <text x="397.0" y="251.0" text-anchor="start"><tspan class="small">below </tspan><tspan class="mono">escalate_at</tspan></text>
  <path class="edge" d="M808.0,214.0 L808.0,276.0" marker-end="url(#arrow)"/>
</svg>
