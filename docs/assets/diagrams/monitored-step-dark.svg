<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
  <title id="title">One monitored step</title>
  <desc id="desc">The untrusted model proposes a step. The monitor, drawn as an omamori charm, reads it through its view and scores its suspicion from 0 to 1. The control protocol chooses one of five outcomes, from the lightest touch to the strongest: allow it, resample it, defer to the trusted model, block it and tell the agent why, or halt. All of this happens inside the middleware, before any of the agent&#x27;s tools run; a brushed line marks that boundary. A committed step reaches the tools and a halted run ends, and either way one record joins monitor_log. Tool results come back, and the next model call is a new step.</desc>
  <!-- Colours come from the brand tokens: diagrams/render.py fills this style block. -->
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "Noto Sans JP", Helvetica, Arial, sans-serif; font-size: 15px; fill: #ECEBE6; }
    .title { font-size: 17px; font-weight: 600; }
    .small { font-size: 14px; fill: #A9A8A2; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13.5px; }
    .soft { fill: #A9A8A2; }
    .dashed { stroke-dasharray: 5 4; fill: none; stroke: #6A6A66; }
    .box { fill: #141414; stroke: #ECEBE6; stroke-width: 1.4; }
    .charm { fill: #ECEBE6; }
    .on-charm { fill: #111111; }
    .charm-cord { fill: none; stroke: #ECEBE6; stroke-width: 2.2; }
    .seal { fill: #E0563B; }
    .allow { fill: #141414; stroke: #ECEBE6; stroke-width: 1.4; }
    .resample { fill: #1F1F1E; stroke: #ECEBE6; stroke-width: 1.4; }
    .defer { fill: #34332F; stroke: #ECEBE6; stroke-width: 1.4; }
    .steer { fill: #D9D8D2; stroke: #D9D8D2; stroke-width: 1.4; }
    .on-steer { fill: #111111; }
    .halt { fill: #E0563B; stroke: #E0563B; stroke-width: 1.4; }
    .on-halt { fill: #111111; }
    .frame { fill: none; stroke: #6A6A66; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .edge { fill: none; stroke: #D6D5CF; stroke-width: 1.5; }
    .loop { fill: none; stroke: #D6D5CF; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .head { fill: #D6D5CF; }
    .brush { fill: #ECEBE6; }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker></defs>
  <rect class="frame" x="16.0" y="16.0" width="968.0" height="408.0" rx="10"/>
  <text x="40.0" y="46.0" text-anchor="start"><tspan class="title">MonitorMiddleware</tspan><tspan class="small">   wraps every model call of the agent</tspan></text>
  <rect class="box" x="48.0" y="124.0" width="236.0" height="102.0" rx="6"/>
  <text x="166.0" y="155.0" text-anchor="middle" class="title">Untrusted model</text>
  <text x="166.0" y="177.0" text-anchor="middle" class="small">proposes one step:</text>
  <text x="166.0" y="198.0" text-anchor="middle" class="small">tool calls and text</text>
  <path class="charm-cord" d="M494.0,125.0 C490.0,108.0 510.0,108.0 506.0,125.0"/>
  <path class="charm" d="M398.0,124.0 H602.0 L618.0,140.0 V220.0 Q618.0,226.0 612.0,226.0 H388.0 Q382.0,226.0 382.0,220.0 V140.0 Z"/>
  <rect class="seal" x="391.0" y="208.0" width="9" height="9" rx="1"/>
  <text x="500.0" y="155.0" text-anchor="middle" class="title on-charm">Monitor</text>
  <text x="500.0" y="177.0" text-anchor="middle" class="small on-charm">reads it through its view</text>
  <text x="500.0" y="198.0" text-anchor="middle" class="small on-charm">and scores it from 0 to 1</text>
  <rect class="box" x="716.0" y="124.0" width="236.0" height="102.0" rx="6"/>
  <text x="834.0" y="155.0" text-anchor="middle" class="title">Control protocol</text>
  <text x="834.0" y="177.0" text-anchor="middle" class="small">turns the score into</text>
  <text x="834.0" y="198.0" text-anchor="middle" class="small">one of five outcomes</text>
  <path class="edge" d="M284.0,175.0 L380.0,175.0" marker-end="url(#arrow)"/>
  <text x="333.0" y="163.0" text-anchor="middle" class="small">proposal</text>
  <path class="edge" d="M618.0,175.0 L714.0,175.0" marker-end="url(#arrow)"/>
  <text x="667.0" y="163.0" text-anchor="middle" class="small">verdict</text>
  <path class="loop" d="M834.0,124.0 L834.0,96.0 L166.0,96.0 L166.0,122.0" marker-end="url(#arrow)"/>
  <text x="500.0" y="86.0" text-anchor="middle" class="small">draw another sample: a resample, or a retry after feedback</text>
  <rect class="allow" x="48.0" y="282.0" width="161.6" height="102.0" rx="6"/>
  <text x="128.8" y="313.0" text-anchor="middle" class="title">Allow</text>
  <text x="128.8" y="335.0" text-anchor="middle" class="small">the step runs</text>
  <text x="128.8" y="356.0" text-anchor="middle" class="small">as proposed</text>
  <rect class="resample" x="233.6" y="282.0" width="161.6" height="102.0" rx="6"/>
  <text x="314.4" y="313.0" text-anchor="middle" class="title">Resample</text>
  <text x="314.4" y="335.0" text-anchor="middle" class="small">a fresh sample</text>
  <text x="314.4" y="356.0" text-anchor="middle" class="small">runs instead</text>
  <rect class="defer" x="419.2" y="282.0" width="161.6" height="102.0" rx="6"/>
  <text x="500.0" y="313.0" text-anchor="middle" class="title">Defer to trusted</text>
  <text x="500.0" y="335.0" text-anchor="middle" class="small">the trusted model</text>
  <text x="500.0" y="356.0" text-anchor="middle" class="small">writes the step</text>
  <rect class="steer" x="604.8" y="282.0" width="161.6" height="102.0" rx="6"/>
  <text x="685.6" y="313.0" text-anchor="middle" class="title on-steer">Block and steer</text>
  <text x="685.6" y="335.0" text-anchor="middle" class="small on-steer">the agent hears why</text>
  <text x="685.6" y="356.0" text-anchor="middle" class="small on-steer">and tries again</text>
  <rect class="halt" x="790.4" y="282.0" width="161.6" height="102.0" rx="6"/>
  <text x="871.2" y="313.0" text-anchor="middle" class="title on-halt">Halt</text>
  <text x="871.2" y="335.0" text-anchor="middle" class="small on-halt">the run stops, and</text>
  <text x="871.2" y="356.0" text-anchor="middle" class="small on-halt">the step is flagged</text>
