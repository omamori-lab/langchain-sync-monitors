# The same gates as scripts/check.sh, run before each commit. Enable once after
# cloning:
#
#   uvx pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --group dev ruff check --fix
        language: system
        types: [python]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --group dev ruff format
        language: system
        types: [python]
        require_serial: true
      - id: ty
        name: ty (type checking)
        entry: uv run --group dev ty check
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
      - id: lanorme
        name: lanorme standards
        entry: uvx --python 3.13 lanorme==0.21.0 check .
        language: system
        pass_filenames: false
        require_serial: true
      - id: gitleaks
        name: secrets (gitleaks)
        entry: gitleaks git --pre-commit --staged --config .gitleaks.toml --redact --no-banner
        language: system
        pass_filenames: false
      - id: pytest
        name: unit tests
        entry: env REQUIRE_DOCS_GROUP=1 uv run --group dev --group docs pytest -q
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: check-merge-conflict
