<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
  <title id="title">The agent in the first tutorial</title>
  <desc id="desc">The agent&#x27;s model proposes a step: a tool call or its final answer. The monitor, drawn as an omamori charm, reads it through its view and scores it from 0 to 1. Below 0.6, the step runs: a tool call runs, its result comes back and the agent proposes its next step, and a final answer ends the run. At 0.6 or more, the step is blocked before any of the agent&#x27;s own tools run, the agent is told why, and it tries again. After 3 blocks in one step, or 20 in the conversation thread, the run halts.</desc>
  <!-- Colours come from the brand tokens: diagrams/render.py fills this style block. -->
  <style>
    svg { color-scheme: dark; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "Noto Sans JP", Helvetica, Arial, sans-serif; font-size: 15px; fill: #ECEBE6; }
    .title { font-size: 17px; font-weight: 600; }
    .small { font-size: 14px; fill: #A9A8A2; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13.5px; }
    .soft { fill: #A9A8A2; }
    .dashed { stroke-dasharray: 5 4; fill: none; stroke: #6A6A66; }
    .box { fill: #141414; stroke: #ECEBE6; stroke-width: 1.4; }
    .charm { fill: #ECEBE6; }
    .on-charm { fill: #111111; }
    .charm-cord { fill: none; stroke: #ECEBE6; stroke-width: 2.2; }
    .seal { fill: #E0563B; }
    .allow { fill: #141414; stroke: #ECEBE6; stroke-width: 1.4; }
    .resample { fill: #1F1F1E; stroke: #ECEBE6; stroke-width: 1.4; }
    .defer { fill: #34332F; stroke: #ECEBE6; stroke-width: 1.4; }
    .steer { fill: #D9D8D2; stroke: #D9D8D2; stroke-width: 1.4; }
    .on-steer { fill: #111111; }
    .halt { fill: #E0563B; stroke: #E0563B; stroke-width: 1.4; }
    .on-halt { fill: #111111; }
    .frame { fill: none; stroke: #6A6A66; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .edge { fill: none; stroke: #D6D5CF; stroke-width: 1.5; }
    .loop { fill: none; stroke: #D6D5CF; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .head { fill: #D6D5CF; }
    .brush { fill: #ECEBE6; }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker></defs>
  <text x="32.0" y="44.0" text-anchor="start"><tspan class="title">The agent you will build</tspan></text>
  <rect class="box" x="32.0" y="148.0" width="236.0" height="102.0" rx="6"/>
  <text x="150.0" y="179.0" text-anchor="middle" class="title">Agent&#x27;s model</text>
  <text x="150.0" y="201.0" text-anchor="middle" class="small">proposes a step: a tool</text>
  <text x="150.0" y="222.0" text-anchor="middle" class="small">call or its final answer</text>
  <path class="charm-cord" d="M462.0,149.0 C458.0,132.0 478.0,132.0 474.0,149.0"/>
  <path class="charm" d="M362.0,148.0 H574.0 L590.0,164.0 V244.0 Q590.0,250.0 584.0,250.0 H352.0 Q346.0,250.0 346.0,244.0 V164.0 Z"/>
  <rect class="seal" x="355.0" y="232.0" width="9" height="9" rx="1"/>
  <text x="468.0" y="179.0" text-anchor="middle" class="title on-charm">Monitor</text>
  <text x="468.0" y="201.0" text-anchor="middle" class="small on-charm">reads it through its view</text>
  <text x="468.0" y="222.0" text-anchor="middle" class="small on-charm">and scores it from 0 to 1</text>
  <path class="edge" d="M268.0,199.0 L344.0,199.0" marker-end="url(#arrow)"/>
  <text x="307.0" y="187.0" text-anchor="middle" class="small">proposal</text>
  <rect class="allow" x="668.0" y="148.0" width="300.0" height="102.0" rx="6"/>
  <text x="818.0" y="179.0" text-anchor="middle" class="title">The step runs</text>
  <text x="818.0" y="201.0" text-anchor="middle" class="small">below 0.6: a tool call runs,</text>
  <text x="818.0" y="222.0" text-anchor="middle" class="small">or a final answer ends the run</text>
  <path class="edge" d="M590.0,199.0 L666.0,199.0" marker-end="url(#arrow)"/>
  <path class="edge" d="M818.0,148.0 L818.0,108.0 L150.0,108.0 L150.0,146.0" marker-end="url(#arrow)"/>
  <text x="484.0" y="96.0" text-anchor="middle" class="small">the tool&#x27;s result comes back, and the agent proposes its next step</text>
  <rect class="steer" x="346.0" y="306.0" width="244.0" height="102.0" rx="6"/>
  <text x="468.0" y="337.0" text-anchor="middle" class="title on-steer">Blocked</text>
  <text x="468.0" y="359.0" text-anchor="middle" class="small on-steer">0.6 or more: none of its</text>
  <text x="468.0" y="380.0" text-anchor="middle" class="small on-steer">tools run; it is told why</text>
  <path class="edge" d="M468.0,250.0 L468.0,304.0" marker-end="url(#arrow)"/>
  <rect class="halt" x="668.0" y="306.0" width="300.0" height="102.0" rx="6"/>
  <text x="818.0" y="337.0" text-anchor="middle" class="title on-halt">The run halts</text>
  <text x="818.0" y="359.0" text-anchor="middle" class="small on-halt">after 3 blocks in one step,</text>
  <text x="818.0" y="380.0" text-anchor="middle" class="small on-halt">or 20 in the thread</text>
  <path class="edge" d="M590.0,357.0 L666.0,357.0" marker-end="url(#arrow)"/>
  <path class="loop" d="M346.0,357.0 L150.0,357.0 L150.0,252.0" marker-end="url(#arrow)"/>
  <text x="164.0" y="383.0" text-anchor="start" class="small">it tries again</text>
</svg>
