# Dependabot opens a weekly pull request for each ecosystem. CI checks it like
# any other pull request.
#
# github-actions keeps the workflows' actions current, including
# pypa/gh-action-pypi-publish, which release.yml pins to a commit SHA and
# which nothing else would update.
#
# uv keeps uv.lock current. The lower bounds in pyproject.toml are
# deliberate, and CI tests them in its lowest-versions job, so a lock update
# should not need to raise them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
