name: Release

# Publishes a release when a version tag such as v0.1.0 is pushed. The gates run
# first; the tag must match the package version; the package goes to PyPI through
# trusted publishing, so no API token is stored in the repository.
#
# Before the first release, register this repository and workflow as a trusted
# publisher on PyPI, with the environment name "pypi".

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group dev --group docs --all-extras

      - name: Run every gate
        run: scripts/check.sh

  build:
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Check that the tag matches the package version
        run: |
          package_version=$(uv run --no-project python -c "import re, pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/langchain_sync_monitors/__init__.py').read_text()).group(1))")
          if [ "v${package_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${package_version}."
            exit 1
          fi

      - name: Build the sdist and the wheel
        run: uv build

      - name: Keep the built distributions for the next jobs
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/langchain-sync-monitors
    permissions:
      id-token: write
    steps:
      - name: Fetch the built distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch the built distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes "See CHANGELOG.md for what changed."
