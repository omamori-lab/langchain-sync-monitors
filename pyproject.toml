[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "langchain-sync-monitors"
dynamic = ["version"]
description = "Control monitors for LangChain agents and Deep Agents, as middleware."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Antonio Badilla-Olivas", email = "antonio1dbo@gmail.com" }]
keywords = ["ai-control", "monitoring", "langchain", "deepagents", "middleware", "ai-safety"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "langchain>=1.4",
    "langchain-core>=1.6",
    "langgraph>=1.2.11",
    "pydantic>=2.12",
    "httpx>=0.27",
    "stamina>=25.1",
]

[project.optional-dependencies]
deepagents = ["deepagents>=0.7.12"]
openrouter = ["langchain-openrouter>=0.2.1"]
typesafe = ["langchain-typesafe>=0.0.1a3"]

[project.urls]
Repository = "https://github.com/Antonio-Tresol/langchain-sync-monitors"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.15",
    "ty>=0.0.84",
    "bibtexparser>=1.4,<2",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    "mkdocs-bibtex>=4",
]

[tool.hatch.version]
path = "src/langchain_sync_monitors/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_sync_monitors"]

[tool.hatch.build.targets.sdist]
# An explicit list, because hatchling ships every file .gitignore does not
# exclude, tracked or not. The docs travel with the tests that check their
# citations; the plans are working notes and stay in the repository.
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
]
exclude = ["/docs/plans"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C90", "ANN", "PT", "RUF", "COM"]
ignore = ["COM812"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN401"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
unused-ignore-comment = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls real model providers; needs OPENROUTER_API_KEY and spends credits"]
addopts = "-m 'not live'"

[tool.lanorme]
ignore = ["LAYER", "PORT", "TERM"]
promote = ["NAMING-006", "NAMING-007", "NAMING-008", "NAMING-011"]
exclude = [".venv/*", ".claude/*", "dist/*", "site/*", "docs/plans/*"]

[tool.lanorme.file_limits]
func_warn_lines = 40
func_error_lines = 60
complexity_warn = 6
complexity_error = 10
param_warn = 5
param_error = 8

[tool.lanorme.prose]
enabled = true

[tool.lanorme.comments]
em_dash = true
emoji = true

[tool.lanorme.named_args]
enabled = true

[tool.lanorme.test_style]
enabled = true

[tool.lanorme.attribute_access]
enabled = true

[tool.lanorme.naming_clean_code]
enabled = true

[tool.lanorme.similarity]
enabled = true

[tool.lanorme.docs]
enabled = true

[tool.lanorme.docstrings]
enabled = true
