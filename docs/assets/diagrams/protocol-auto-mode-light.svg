<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="544" viewBox="0 0 1000 544" role="img" aria-labelledby="title desc">
  <title id="title">Auto Mode, one step</title>
  <desc id="desc">A new step starts with the agent&#x27;s model, which proposes an attempt, seeing the step&#x27;s blocked attempts and their feedback. The monitor, drawn as an omamori charm, reads it through its view and scores it from 0 to 1. Below block_threshold the attempt runs: on the first attempt the outcome is allowed, and after a block it is steered and flagged. At or above block_threshold the attempt is blocked, and the feedback tells the agent why. If no limit is reached, the agent tries again. Once the step&#x27;s blocks reach max_consecutive_blocks, 3 by default, or the thread&#x27;s blocks reach max_total_blocks, 20 by default, when_limit_reached writes the step, flagged: by default HaltRun ends the run, recorded as halted, and DeferToTrustedModel has the trusted model write it instead, recorded as deferred_to_trusted. A step goes to when_limit_reached at once, with no attempt, when blocks inside subagents since this agent&#x27;s last step leave the thread at or over max_total_blocks.</desc>
  <!-- Colours come from the brand tokens: diagrams/render.py fills this style block. -->
  <style>
    svg { color-scheme: light; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "Noto Sans JP", Helvetica, Arial, sans-serif; font-size: 15px; fill: #111111; }
    .title { font-size: 17px; font-weight: 600; }
    .small { font-size: 14px; fill: #5B5B57; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13.5px; }
    .soft { fill: #5B5B57; }
    .dashed { stroke-dasharray: 5 4; fill: none; stroke: #9A9A94; }
    .box { fill: #FFFFFF; stroke: #111111; stroke-width: 1.4; }
    .charm { fill: #111111; }
    .on-charm { fill: #FFFFFF; }
    .charm-cord { fill: none; stroke: #111111; stroke-width: 2.2; }
    .seal { fill: #BF3A22; }
    .allow { fill: #FFFFFF; stroke: #111111; stroke-width: 1.4; }
    .resample { fill: #F2F1EC; stroke: #111111; stroke-width: 1.4; }
    .defer { fill: #DCDBD4; stroke: #111111; stroke-width: 1.4; }
    .steer { fill: #3A3A38; stroke: #3A3A38; stroke-width: 1.4; }
    .on-steer { fill: #FFFFFF; }
    .halt { fill: #BF3A22; stroke: #BF3A22; stroke-width: 1.4; }
    .on-halt { fill: #FFFFFF; }
    .frame { fill: none; stroke: #9A9A94; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .edge { fill: none; stroke: #2B2B2B; stroke-width: 1.5; }
    .loop { fill: none; stroke: #2B2B2B; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .head { fill: #2B2B2B; }
    .brush { fill: #111111; }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker></defs>
  <text x="32.0" y="44.0" text-anchor="start"><tspan class="title">Auto Mode: block, say why, try again</tspan></text>
  <rect class="box" x="72.0" y="72.0" width="156.0" height="54.0" rx="6"/>
  <text x="150.0" y="100.0" text-anchor="middle" class="title">A new step</text>
  <rect class="box" x="32.0" y="202.0" width="236.0" height="102.0" rx="6"/>
  <text x="150.0" y="233.0" text-anchor="middle" class="title">Agent&#x27;s model</text>
  <text x="150.0" y="255.0" text-anchor="middle" class="small">proposes an attempt;</text>
  <text x="150.0" y="276.0" text-anchor="middle" class="small">a retry sees the feedback</text>
  <path class="charm-cord" d="M462.0,203.0 C458.0,186.0 478.0,186.0 474.0,203.0"/>
  <path class="charm" d="M362.0,202.0 H574.0 L590.0,218.0 V298.0 Q590.0,304.0 584.0,304.0 H352.0 Q346.0,304.0 346.0,298.0 V218.0 Z"/>
  <rect class="seal" x="355.0" y="286.0" width="9" height="9" rx="1"/>
  <text x="468.0" y="233.0" text-anchor="middle" class="title on-charm">Monitor</text>
  <text x="468.0" y="255.0" text-anchor="middle" class="small on-charm">reads it through its view</text>
  <text x="468.0" y="276.0" text-anchor="middle" class="small on-charm">and scores it from 0 to 1</text>
  <path class="edge" d="M268.0,253.0 L344.0,253.0" marker-end="url(#arrow)"/>
  <text x="307.0" y="241.0" text-anchor="middle" class="small">proposal</text>
  <path class="edge" d="M150.0,126.0 L150.0,200.0" marker-end="url(#arrow)"/>
  <rect class="allow" x="668.0" y="149.5" width="268.0" height="81.0" rx="6"/>
  <text x="802.0" y="180.5" text-anchor="middle" class="title">First attempt passes</text>
  <text x="802.0" y="202.5" text-anchor="middle"><tspan class="small">it runs: </tspan><tspan class="mono">allowed</tspan></text>
  <rect class="allow" x="668.0" y="254.5" width="268.0" height="102.0" rx="6"/>
  <text x="802.0" y="285.5" text-anchor="middle" class="title">A retry passes</text>
  <text x="802.0" y="307.5" text-anchor="middle" class="small">it runs, flagged:</text>
  <text x="802.0" y="328.5" text-anchor="middle"><tspan class="mono">steered</tspan></text>
  <path class="edge" d="M590.0,253.0 L628.0,253.0"/>
  <path class="edge" d="M628.0,190.0 L628.0,305.5"/>
  <path class="edge" d="M628.0,190.0 L666.0,190.0" marker-end="url(#arrow)"/>
  <path class="edge" d="M628.0,305.5 L666.0,305.5" marker-end="url(#arrow)"/>
  <rect class="steer" x="346.0" y="384.5" width="244.0" height="102.0" rx="6"/>
  <text x="468.0" y="415.5" text-anchor="middle" class="title on-steer">Blocked</text>
  <text x="468.0" y="437.5" text-anchor="middle"><tspan class="small on-steer">at or above </tspan><tspan class="mono on-steer">block_threshold</tspan><tspan class="small on-steer">:</tspan></text>
  <text x="468.0" y="458.5" text-anchor="middle" class="small on-steer">the agent is told why</text>
  <path class="edge" d="M468.0,304.0 L468.0,382.5" marker-end="url(#arrow)"/>
  <rect class="halt" x="668.0" y="384.5" width="268.0" height="102.0" rx="6"/>
  <text x="802.0" y="415.5" text-anchor="middle" class="title on-halt">Limit reached</text>
  <text x="802.0" y="437.5" text-anchor="middle" class="small on-halt">3 in the step, or 20 in the thread:</text>
  <text x="802.0" y="458.5" text-anchor="middle" class="small on-halt">the fallback, a halt by default</text>
  <path class="edge" d="M590.0,435.5 L666.0,435.5" marker-end="url(#arrow)"/>
  <path class="loop" d="M346.0,435.5 L150.0,435.5 L150.0,306.0" marker-end="url(#arrow)"/>
  <text x="164.0" y="461.5" text-anchor="start" class="small">no limit reached: try again</text>
  <path class="edge" d="M228.0,99.0 L964.0,99.0 L964.0,435.5 L938.0,435.5" marker-end="url(#arrow)"/>
  <text x="252.0" y="89.0" text-anchor="start" class="small">blocks inside subagents since the last step left the thread at or over the total: no attempt</text>
</svg>
