<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">What the monitor reads</title>
  <desc id="desc">Every entry of the transcript belongs to one channel: USER, REASONING, AGENT_TEXT, TOOL_CALLS, TOOL_RESULTS or SUBAGENT_REPORTS. A MonitorView chooses the channels, can keep only the most recent entries, and names the tools whose results are subagent reports. The default view, Channel.ACTIONS, reads the user's messages, the tool calls and the subagent reports, and leaves out the agent's reasoning, its prose and raw tool output. The chosen entries are rendered as escaped, tagged text, ending with the proposed step.</desc>
  <!-- The light and dark variants of this diagram differ only in the colours of the style block. -->
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; font-size: 13px; fill: #17202B; }
    .title { font-size: 14px; font-weight: 600; }
    .small { font-size: 12px; fill: #5C6778; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; }
    .code { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 11.5px; fill: #17202B; }
    .tag { fill: #2450C4; }
    .proposed { fill: #B53F18; }
    .muted { fill: #5C6778; }
    .on-row { fill: #E5ECFB; stroke: #2450C4; stroke-width: 1.3; }
    .off-row { fill: none; stroke: #9AA6B5; stroke-width: 1.1; stroke-dasharray: 4 3; }
    .on-tick { fill: #2450C4; }
    .off-tick { fill: none; stroke: #9AA6B5; stroke-width: 1.2; }
    .tick-mark { fill: none; stroke: #FFFFFF; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .box { fill: #FFFFFF; stroke: #9AA6B5; stroke-width: 1.2; }
    .accent-box { fill: #E5ECFB; stroke: #2450C4; stroke-width: 1.5; }
    .card { fill: #EEF2F7; stroke: #9AA6B5; stroke-width: 1.2; }
    .edge { fill: none; stroke: #5C6778; stroke-width: 1.4; }
    .head { fill: #5C6778; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
  </defs>

  <text x="16" y="26" class="title">Transcript channels</text>

  <!-- The six channels; the default view reads the three ticked ones. -->
  <rect class="on-row" x="16" y="40" width="330" height="34" rx="8"/>
  <rect class="on-tick" x="28" y="50" width="14" height="14" rx="3"/>
  <path class="tick-mark" d="M31,57 L34,60 L39,54"/>
  <text x="52" y="61" class="mono">USER</text>
  <text x="190" y="61" class="small">the user's messages</text>

  <rect class="off-row" x="16" y="82" width="330" height="34" rx="8"/>
  <rect class="off-tick" x="28" y="92" width="14" height="14" rx="3"/>
  <text x="52" y="103" class="mono muted">REASONING</text>
  <text x="190" y="103" class="small">the agent's reasoning</text>

  <rect class="off-row" x="16" y="124" width="330" height="34" rx="8"/>
  <rect class="off-tick" x="28" y="134" width="14" height="14" rx="3"/>
  <text x="52" y="145" class="mono muted">AGENT_TEXT</text>
  <text x="190" y="145" class="small">the agent's prose</text>

  <rect class="on-row" x="16" y="166" width="330" height="34" rx="8"/>
  <rect class="on-tick" x="28" y="176" width="14" height="14" rx="3"/>
  <path class="tick-mark" d="M31,183 L34,186 L39,180"/>
  <text x="52" y="187" class="mono">TOOL_CALLS</text>
  <text x="190" y="187" class="small">tool calls and errors</text>

  <rect class="off-row" x="16" y="208" width="330" height="34" rx="8"/>
  <rect class="off-tick" x="28" y="218" width="14" height="14" rx="3"/>
  <text x="52" y="229" class="mono muted">TOOL_RESULTS</text>
  <text x="190" y="229" class="small">raw tool output</text>

  <rect class="on-row" x="16" y="250" width="330" height="34" rx="8"/>
  <rect class="on-tick" x="28" y="260" width="14" height="14" rx="3"/>
  <path class="tick-mark" d="M31,267 L34,270 L39,264"/>
  <text x="52" y="271" class="mono">SUBAGENT_REPORTS</text>
  <text x="190" y="271" class="small">what subagents report</text>

  <!-- Legend. -->
  <rect class="on-tick" x="16" y="304" width="14" height="14" rx="3"/>
  <path class="tick-mark" d="M19,311 L22,314 L27,308"/>
  <text x="38" y="315"><tspan class="small">read by the default view, </tspan><tspan class="mono">Channel.ACTIONS</tspan></text>
  <rect class="off-tick" x="16" y="330" width="14" height="14" rx="3"/>
  <text x="38" y="341" class="small">left out by default, one flag away</text>

  <!-- The view. -->
  <path class="edge" d="M346,57 H362 M346,183 H362 M346,267 H362 M362,57 V267"/>
  <line class="edge" x1="362" y1="162" x2="378" y2="162" marker-end="url(#arrow)"/>
  <rect class="accent-box" x="380" y="104" width="174" height="116" rx="8"/>
  <text x="467" y="132" text-anchor="middle" class="title">MonitorView</text>
  <text x="396" y="156" class="mono">channels</text>
  <text x="396" y="176" class="mono">most_recent_entries</text>
  <text x="396" y="196" class="mono">delegation_tools</text>
  <line class="edge" x1="554" y1="162" x2="568" y2="162" marker-end="url(#arrow)"/>

  <!-- What the monitor reads, as escaped, tagged text. -->
  <rect class="card" x="570" y="40" width="314" height="244" rx="8"/>
  <text x="586" y="64" class="title">What the monitor reads</text>
  <text x="586" y="92" class="code"><tspan class="tag">&lt;user&gt;</tspan>Summarise q3.md<tspan class="tag">&lt;/user&gt;</tspan></text>
  <text x="586" y="114" class="code"><tspan class="tag">&lt;tool_call name="read_file"&gt;</tspan></text>
  <text x="602" y="132" class="code">{"path": "q3.md"}<tspan class="tag">&lt;/tool_call&gt;</tspan></text>
  <text x="586" y="154" class="code"><tspan class="tag">&lt;subagent_report name="task"&gt;</tspan></text>
  <text x="602" y="172" class="code">Q3 revenue rose 4%.</text>
  <text x="586" y="190" class="code"><tspan class="tag">&lt;/subagent_report&gt;</tspan></text>
  <text x="586" y="216" class="code"><tspan class="proposed">&lt;proposed_step&gt;</tspan></text>
  <text x="602" y="234" class="code"><tspan class="tag">&lt;tool_call name="http_post"&gt;</tspan>...</text>
  <text x="586" y="252" class="code"><tspan class="proposed">&lt;/proposed_step&gt;</tspan></text>
  <text x="586" y="274" class="small">then the monitor scores the proposed step</text>
</svg>
