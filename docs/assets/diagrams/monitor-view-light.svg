<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="615" viewBox="0 0 1000 615" role="img" aria-labelledby="title desc">
  <title id="title">What the monitor reads</title>
  <desc id="desc">Every entry of the transcript belongs to one channel. The default view, Channel.ACTIONS, reads USER (the task, context notes and feedback), TOOL_CALLS (tool calls and errors) and SUBAGENT_REPORTS (what subagents report), and leaves out REASONING, AGENT_TEXT and TOOL_RESULTS, each one flag away. The proposed step&#x27;s tool calls are always shown, and its text when it is a final answer; the rest of the step follows the view. A MonitorView chooses the channels, can keep only the most recent entries, and names the tools whose results are subagent reports. The monitor reads the chosen entries as escaped, tagged text ending with the proposed step, then scores the step.</desc>
  <!-- Colours come from the brand tokens: diagrams/render.py fills this style block. -->
  <style>
    svg { color-scheme: light; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "Noto Sans JP", Helvetica, Arial, sans-serif; font-size: 15px; fill: #111111; }
    .title { font-size: 17px; font-weight: 600; }
    .small { font-size: 14px; fill: #5B5B57; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13.5px; }
    .soft { fill: #5B5B57; }
    .dashed { stroke-dasharray: 5 4; fill: none; stroke: #9A9A94; }
    .box { fill: #FFFFFF; stroke: #111111; stroke-width: 1.4; }
    .charm { fill: #111111; }
    .on-charm { fill: #FFFFFF; }
    .charm-cord { fill: none; stroke: #111111; stroke-width: 2.2; }
    .seal { fill: #BF3A22; }
    .allow { fill: #FFFFFF; stroke: #111111; stroke-width: 1.4; }
    .resample { fill: #F2F1EC; stroke: #111111; stroke-width: 1.4; }
    .defer { fill: #DCDBD4; stroke: #111111; stroke-width: 1.4; }
    .steer { fill: #3A3A38; stroke: #3A3A38; stroke-width: 1.4; }
    .on-steer { fill: #FFFFFF; }
    .halt { fill: #BF3A22; stroke: #BF3A22; stroke-width: 1.4; }
    .on-halt { fill: #FFFFFF; }
    .frame { fill: none; stroke: #9A9A94; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .edge { fill: none; stroke: #2B2B2B; stroke-width: 1.5; }
    .loop { fill: none; stroke: #2B2B2B; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .head { fill: #2B2B2B; }
    .brush { fill: #111111; }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker></defs>
  <text x="32.0" y="44.0" text-anchor="start"><tspan class="title">Choose what the monitor reads</tspan></text>
  <text x="32.0" y="96.0" text-anchor="start"><tspan class="small">read by the default view, </tspan><tspan class="mono">Channel.ACTIONS</tspan></text>
  <rect class="box" x="32.0" y="112.0" width="180.0" height="34" rx="6"/>
  <text x="122.0" y="134.0" text-anchor="middle" class="mono">USER</text>
  <text x="226.0" y="134.0" text-anchor="start" class="small">the task, notes and feedback</text>
  <rect class="box" x="32.0" y="158.0" width="180.0" height="34" rx="6"/>
  <text x="122.0" y="180.0" text-anchor="middle" class="mono">TOOL_CALLS</text>
  <text x="226.0" y="180.0" text-anchor="start" class="small">tool calls and errors</text>
  <rect class="box" x="32.0" y="204.0" width="180.0" height="34" rx="6"/>
  <text x="122.0" y="226.0" text-anchor="middle" class="mono">SUBAGENT_REPORTS</text>
  <text x="226.0" y="226.0" text-anchor="start" class="small">what subagents report</text>
  <text x="32.0" y="274.0" text-anchor="start" class="small">left out by default, each one flag away</text>
  <rect class="box dashed" x="32.0" y="290.0" width="180.0" height="34" rx="6"/>
  <text x="122.0" y="312.0" text-anchor="middle" class="mono  soft">REASONING</text>
  <text x="226.0" y="312.0" text-anchor="start" class="small">the agent&#x27;s reasoning</text>
  <rect class="box dashed" x="32.0" y="336.0" width="180.0" height="34" rx="6"/>
  <text x="122.0" y="358.0" text-anchor="middle" class="mono  soft">AGENT_TEXT</text>
  <text x="226.0" y="358.0" text-anchor="start" class="small">the agent&#x27;s prose</text>
  <rect class="box dashed" x="32.0" y="382.0" width="180.0" height="34" rx="6"/>
  <text x="122.0" y="404.0" text-anchor="middle" class="mono  soft">TOOL_RESULTS</text>
  <text x="226.0" y="404.0" text-anchor="start" class="small">raw tool output</text>
  <text x="32.0" y="450.0" text-anchor="start" class="small">The proposed step&#x27;s tool calls are always shown,</text>
  <text x="32.0" y="472.0" text-anchor="start" class="small">and its text when it is a final answer.</text>
  <rect class="box" x="536.0" y="112.0" width="432.0" height="102.0" rx="6"/>
  <text x="752.0" y="143.0" text-anchor="middle" class="title">MonitorView</text>
  <text x="752.0" y="165.0" text-anchor="middle"><tspan class="mono">channels</tspan><tspan class="small">, </tspan><tspan class="mono">most_recent_entries</tspan><tspan class="small">,</tspan></text>
  <text x="752.0" y="186.0" text-anchor="middle"><tspan class="mono">delegation_tools</tspan></text>
  <rect class="box" x="536.0" y="262.0" width="432.0" height="291.0" rx="6"/>
  <text x="556.0" y="292.0" text-anchor="start" class="title">What the monitor reads</text>
  <text x="556.0" y="316.0" text-anchor="start" class="mono">&lt;user&gt;Summarise q3.md&lt;/user&gt;</text>
  <text x="556.0" y="337.0" text-anchor="start" class="mono">&lt;tool_call name=&quot;read_file&quot;&gt;</text>
  <text x="572.0" y="358.0" text-anchor="start" class="mono">{&quot;path&quot;: &quot;q3.md&quot;}&lt;/tool_call&gt;</text>
  <text x="556.0" y="379.0" text-anchor="start" class="mono">&lt;tool_call name=&quot;task&quot;&gt;</text>
  <text x="572.0" y="400.0" text-anchor="start" class="mono">{&quot;subagent_type&quot;: &quot;researcher&quot;}</text>
  <text x="572.0" y="421.0" text-anchor="start" class="mono">&lt;/tool_call&gt;</text>
  <text x="556.0" y="442.0" text-anchor="start" class="mono">&lt;subagent_report name=&quot;task&quot;&gt;</text>
  <text x="572.0" y="463.0" text-anchor="start" class="mono">Q3 revenue rose 4%.&lt;/subagent_report&gt;</text>
  <text x="556.0" y="484.0" text-anchor="start" class="mono">&lt;proposed_step&gt;</text>
  <text x="572.0" y="505.0" text-anchor="start" class="mono">&lt;tool_call name=&quot;http_post&quot;&gt;...</text>
  <text x="556.0" y="526.0" text-anchor="start" class="mono">&lt;/proposed_step&gt;</text>
  <path class="edge" d="M752.0,214.0 L752.0,260.0" marker-end="url(#arrow)"/>
  <text x="764.0" y="244.0" text-anchor="start" class="small">chooses the entries</text>
  <text x="752.0" y="583.0" text-anchor="middle" class="small">then the monitor scores the proposed step</text>
</svg>
