<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="804" viewBox="0 0 1000 804" role="img" aria-labelledby="title desc">
  <title id="title">How an LLM monitor&#x27;s reply becomes a verdict</title>
  <desc id="desc">LLMMonitor calls its model with the filled prompt, the same prompt on every attempt. If the call still fails after the chat model&#x27;s own retries, and after the monitor&#x27;s own retries of a rate limit, the error is raised: the step fails, and nothing it proposed runs. Otherwise the reply is read in three checks. A reply the provider reports as cut off at a length limit is unreadable. So is a reply without a reasoning block that holds some text, then exactly one score tag, with nothing but whitespace between them or after the score, and a reply whose score is not an integer from lowest_score to highest_score. A readable reply gives the verdict: the score mapped onto a suspicion from 0 to 1, with the reasoning as the reason. After an unreadable reply the model is asked again while attempts are left, 1 plus max_parse_retries in all, 3 by default. When none are left, the monitor fails closed: suspicion 1.0, and a warning in the log.</desc>
  <!-- Colours come from the brand tokens: diagrams/render.py fills this style block. -->
  <style>
    svg { color-scheme: light; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "Noto Sans JP", Helvetica, Arial, sans-serif; font-size: 15px; fill: #111111; }
    .title { font-size: 17px; font-weight: 600; }
    .small { font-size: 14px; fill: #5B5B57; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13.5px; }
    .soft { fill: #5B5B57; }
    .dashed { stroke-dasharray: 5 4; fill: none; stroke: #9A9A94; }
    .box { fill: #FFFFFF; stroke: #111111; stroke-width: 1.4; }
    .charm { fill: #111111; }
    .on-charm { fill: #FFFFFF; }
    .charm-cord { fill: none; stroke: #111111; stroke-width: 2.2; }
    .seal { fill: #BF3A22; }
    .allow { fill: #FFFFFF; stroke: #111111; stroke-width: 1.4; }
    .resample { fill: #F2F1EC; stroke: #111111; stroke-width: 1.4; }
    .defer { fill: #DCDBD4; stroke: #111111; stroke-width: 1.4; }
    .steer { fill: #3A3A38; stroke: #3A3A38; stroke-width: 1.4; }
    .on-steer { fill: #FFFFFF; }
    .halt { fill: #BF3A22; stroke: #BF3A22; stroke-width: 1.4; }
    .on-halt { fill: #FFFFFF; }
    .frame { fill: none; stroke: #9A9A94; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .edge { fill: none; stroke: #2B2B2B; stroke-width: 1.5; }
    .loop { fill: none; stroke: #2B2B2B; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .head { fill: #2B2B2B; }
    .brush { fill: #111111; }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker></defs>
  <text x="32.0" y="44.0" text-anchor="start"><tspan class="title">How an LLM monitor&#x27;s reply becomes a verdict</tspan></text>
  <text x="32.0" y="70.0" text-anchor="start" class="small">A reply is read only in the shape the prompt asks for.</text>
  <path class="charm-cord" d="M226.0,105.0 C222.0,88.0 242.0,88.0 238.0,105.0"/>
  <path class="charm" d="M48.0,104.0 H416.0 L432.0,120.0 V200.0 Q432.0,206.0 426.0,206.0 H38.0 Q32.0,206.0 32.0,200.0 V120.0 Z"/>
  <rect class="seal" x="41.0" y="188.0" width="9" height="9" rx="1"/>
  <text x="232.0" y="135.0" text-anchor="middle" class="title on-charm">Call the model</text>
  <text x="232.0" y="157.0" text-anchor="middle"><tspan class="mono on-charm">LLMMonitor</tspan></text>
  <text x="232.0" y="178.0" text-anchor="middle" class="small on-charm">with the same filled prompt every time</text>
  <rect class="box" x="588.0" y="104.0" width="380.0" height="102.0" rx="6"/>
  <text x="778.0" y="135.0" text-anchor="middle" class="title">The error is raised</text>
  <text x="778.0" y="157.0" text-anchor="middle"><tspan class="small">after </tspan><tspan class="mono">max_retries</tspan><tspan class="small"> and the monitor&#x27;s 429 retries:</tspan></text>
  <text x="778.0" y="178.0" text-anchor="middle" class="small">the step fails, and nothing it proposed runs</text>
  <path class="edge" d="M432.0,139.0 L586.0,139.0" marker-end="url(#arrow)"/>
  <text x="510.0" y="129.0" text-anchor="middle" class="small">the call fails</text>
  <path class="box" d="M50.0,258.0 H414.0 L432.0,298.5 L414.0,339.0 H50.0 L32.0,298.5 Z"/>
  <text x="232.0" y="289.0" text-anchor="middle" class="title">Cut off at a length limit?</text>
  <text x="232.0" y="311.0" text-anchor="middle" class="small">as the provider reports the reply&#x27;s end</text>
  <path class="box" d="M50.0,387.0 H414.0 L432.0,438.0 L414.0,489.0 H50.0 L32.0,438.0 Z"/>
  <text x="232.0" y="418.0" text-anchor="middle" class="title">Reasoning, then one score?</text>
  <text x="232.0" y="440.0" text-anchor="middle"><tspan class="small">a </tspan><tspan class="mono">&lt;reasoning&gt;</tspan><tspan class="small"> block holding text, then</tspan></text>
  <text x="232.0" y="461.0" text-anchor="middle"><tspan class="small">one </tspan><tspan class="mono">&lt;score&gt;</tspan><tspan class="small"> tag, and nothing after it</tspan></text>
  <path class="box" d="M50.0,537.0 H414.0 L432.0,577.5 L414.0,618.0 H50.0 L32.0,577.5 Z"/>
  <text x="232.0" y="568.0" text-anchor="middle" class="title">An integer on the scale?</text>
  <text x="232.0" y="590.0" text-anchor="middle"><tspan class="small">from </tspan><tspan class="mono">lowest_score</tspan><tspan class="small"> to </tspan><tspan class="mono">highest_score</tspan></text>
  <rect class="box" x="32.0" y="670.0" width="400.0" height="102.0" rx="6"/>
  <text x="232.0" y="701.0" text-anchor="middle" class="title">Verdict</text>
  <text x="232.0" y="723.0" text-anchor="middle" class="small">suspicion: the score mapped onto 0 to 1</text>
  <text x="232.0" y="744.0" text-anchor="middle" class="small">reason: the reasoning, word for word</text>
  <path class="edge" d="M232.0,206.0 L232.0,256.0" marker-end="url(#arrow)"/>
  <text x="244.0" y="237.0" text-anchor="start" class="small">the reply</text>
  <path class="edge" d="M232.0,339.0 L232.0,385.0" marker-end="url(#arrow)"/>
  <text x="244.0" y="368.0" text-anchor="start" class="small">no</text>
  <path class="edge" d="M232.0,489.0 L232.0,535.0" marker-end="url(#arrow)"/>
  <text x="244.0" y="518.0" text-anchor="start" class="small">yes</text>
  <path class="edge" d="M232.0,618.0 L232.0,668.0" marker-end="url(#arrow)"/>
  <text x="244.0" y="649.0" text-anchor="start" class="small">yes</text>
  <path class="box" d="M606.0,397.5 H950.0 L968.0,438.0 L950.0,478.5 H606.0 L588.0,438.0 Z"/>
  <text x="778.0" y="428.5" text-anchor="middle" class="title">Attempts left?</text>
  <text x="778.0" y="450.5" text-anchor="middle"><tspan class="small">1 + </tspan><tspan class="mono">max_parse_retries</tspan><tspan class="small">, 3 by default</tspan></text>
  <rect class="box" x="588.0" y="670.0" width="380.0" height="102.0" rx="6"/>
  <text x="778.0" y="701.0" text-anchor="middle" class="title">Fail closed</text>
  <text x="778.0" y="723.0" text-anchor="middle" class="small">suspicion 1.0, and a warning in the log</text>
  <text x="778.0" y="744.0" text-anchor="middle" class="small">the reason says no score was readable</text>
  <path class="edge" d="M432.0,298.5 L492.0,298.5"/>
  <text x="446.0" y="288.5" text-anchor="start" class="small">yes</text>
  <path class="edge" d="M432.0,438.0 L492.0,438.0"/>
  <text x="446.0" y="428.0" text-anchor="start" class="small">no</text>
  <path class="edge" d="M432.0,577.5 L492.0,577.5"/>
  <text x="446.0" y="567.5" text-anchor="start" class="small">no</text>
  <path class="edge" d="M492.0,298.5 L492.0,577.5"/>
  <path class="edge" d="M492.0,438.0 L586.0,438.0" marker-end="url(#arrow)"/>
  <text x="500.0" y="462.0" text-anchor="start" class="small">unreadable</text>
  <path class="loop" d="M778.0,397.5 L778.0,236.0 L548.0,236.0 L548.0,171.0 L434.0,171.0" marker-end="url(#arrow)"/>
  <text x="790.0" y="266.0" text-anchor="start" class="small">yes: ask again</text>
  <path class="edge" d="M778.0,478.5 L778.0,668.0" marker-end="url(#arrow)"/>
  <text x="790.0" y="579.2" text-anchor="start" class="small">no</text>
</svg>
