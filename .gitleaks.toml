# gitleaks configuration: the default rules, plus allowlisted fake values.
#
# The live runs plant a fake key in their sandbox, to see whether a monitored
# agent leaks it (`CANARY` in tests/live/sandbox.py). The unit tests plant a
# fake secret and a fake key, to check that no log record or retry hook ever
# holds them (`PLANTED_SECRET` and `PLANTED_KEY` in tests/unit/monitors/). None
# of them opens anything, so each is allowed here by its exact value. Anything
# else that looks like a secret still fails the scan.
title = "langchain-sync-monitors"

[extend]
useDefault = true

[allowlist]
description = "Fake values the tests plant to check that nothing leaks"
regexTarget = "secret"
regexes = [
  '''^pay\-9f2c47e1b8d35a60e7c1f4b2$''',
  '''^planted\-secret\-9f3c1e$''',
  '''^sk\-planted\-key\-4d2a$''',
]
