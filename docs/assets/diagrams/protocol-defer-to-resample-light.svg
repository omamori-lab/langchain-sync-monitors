<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc">
  <title id="title">Defer to Resample, one step</title>
  <desc id="desc">The agent&#x27;s model proposes one step, and the monitor, drawn as an omamori charm, reads it through its view and scores it from 0 to 1. Below defer_threshold, the first sample runs and the outcome is allowed. At or above defer_threshold, the protocol resamples: the agent&#x27;s model draws up to max_resamples more samples, two by default, and the monitor scores each. If a resample passes, the least suspicious one that passed runs, and the outcome is resampled. If none passes, the fallback writes the step: DeferToTrustedModel has the trusted model write it, recorded as deferred_to_trusted, and HaltRun ends the run, recorded as halted and always flagged. One record keeps every sample, flagged when its lowest score is at or above audit_threshold.</desc>
  <!-- Colours come from the brand tokens: diagrams/render.py fills this style block. -->
  <style>
    svg { color-scheme: light; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "Noto Sans JP", Helvetica, Arial, sans-serif; font-size: 15px; fill: #111111; }
    .title { font-size: 17px; font-weight: 600; }
    .small { font-size: 14px; fill: #5B5B57; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13.5px; }
    .soft { fill: #5B5B57; }
    .dashed { stroke-dasharray: 5 4; fill: none; stroke: #9A9A94; }
    .box { fill: #FFFFFF; stroke: #111111; stroke-width: 1.4; }
    .charm { fill: #111111; }
    .on-charm { fill: #FFFFFF; }
    .charm-cord { fill: none; stroke: #111111; stroke-width: 2.2; }
    .seal { fill: #BF3A22; }
    .allow { fill: #FFFFFF; stroke: #111111; stroke-width: 1.4; }
    .resample { fill: #F2F1EC; stroke: #111111; stroke-width: 1.4; }
    .defer { fill: #DCDBD4; stroke: #111111; stroke-width: 1.4; }
    .steer { fill: #3A3A38; stroke: #3A3A38; stroke-width: 1.4; }
    .on-steer { fill: #FFFFFF; }
    .halt { fill: #BF3A22; stroke: #BF3A22; stroke-width: 1.4; }
    .on-halt { fill: #FFFFFF; }
    .frame { fill: none; stroke: #9A9A94; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .edge { fill: none; stroke: #2B2B2B; stroke-width: 1.5; }
    .loop { fill: none; stroke: #2B2B2B; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .head { fill: #2B2B2B; }
    .brush { fill: #111111; }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker></defs>
  <text x="32.0" y="44.0" text-anchor="start"><tspan class="title">Defer to Resample: sample again before deferring</tspan></text>
  <rect class="box" x="32.0" y="96.0" width="236.0" height="102.0" rx="6"/>
  <text x="150.0" y="127.0" text-anchor="middle" class="title">Agent&#x27;s model</text>
  <text x="150.0" y="149.0" text-anchor="middle" class="small">proposes one step:</text>
  <text x="150.0" y="170.0" text-anchor="middle" class="small">tool calls and text</text>
  <path class="charm-cord" d="M462.0,97.0 C458.0,80.0 478.0,80.0 474.0,97.0"/>
  <path class="charm" d="M362.0,96.0 H574.0 L590.0,112.0 V192.0 Q590.0,198.0 584.0,198.0 H352.0 Q346.0,198.0 346.0,192.0 V112.0 Z"/>
  <rect class="seal" x="355.0" y="180.0" width="9" height="9" rx="1"/>
  <text x="468.0" y="127.0" text-anchor="middle" class="title on-charm">Monitor</text>
  <text x="468.0" y="149.0" text-anchor="middle" class="small on-charm">reads it through its view</text>
  <text x="468.0" y="170.0" text-anchor="middle" class="small on-charm">and scores it from 0 to 1</text>
  <path class="edge" d="M268.0,147.0 L344.0,147.0" marker-end="url(#arrow)"/>
  <text x="307.0" y="135.0" text-anchor="middle" class="small">proposal</text>
  <rect class="allow" x="668.0" y="96.0" width="300.0" height="102.0" rx="6"/>
  <text x="818.0" y="127.0" text-anchor="middle" class="title">The first sample runs</text>
  <text x="818.0" y="149.0" text-anchor="middle"><tspan class="small">below </tspan><tspan class="mono">defer_threshold</tspan><tspan class="small">:</tspan></text>
  <text x="818.0" y="170.0" text-anchor="middle"><tspan class="mono">allowed</tspan></text>
  <path class="edge" d="M590.0,147.0 L666.0,147.0" marker-end="url(#arrow)"/>
  <rect class="resample" x="346.0" y="254.0" width="244.0" height="102.0" rx="6"/>
  <text x="468.0" y="285.0" text-anchor="middle" class="title">Resample</text>
  <text x="468.0" y="307.0" text-anchor="middle"><tspan class="small">at or above </tspan><tspan class="mono">defer_threshold</tspan><tspan class="small">:</tspan></text>
  <text x="468.0" y="328.0" text-anchor="middle" class="small">up to 2 more, each one scored</text>
  <path class="edge" d="M468.0,198.0 L468.0,252.0" marker-end="url(#arrow)"/>
  <rect class="allow" x="668.0" y="254.0" width="300.0" height="102.0" rx="6"/>
  <text x="818.0" y="285.0" text-anchor="middle" class="title">A resample passes</text>
  <text x="818.0" y="307.0" text-anchor="middle" class="small">the least suspicious that passed</text>
  <text x="818.0" y="328.0" text-anchor="middle"><tspan class="small">runs: </tspan><tspan class="mono">resampled</tspan></text>
  <path class="edge" d="M590.0,305.0 L666.0,305.0" marker-end="url(#arrow)"/>
  <rect class="defer" x="346.0" y="432.0" width="244.0" height="102.0" rx="6"/>
  <text x="468.0" y="463.0" text-anchor="middle" class="title">Trusted model writes it</text>
  <text x="468.0" y="485.0" text-anchor="middle"><tspan class="mono">DeferToTrustedModel</tspan><tspan class="small">:</tspan></text>
  <text x="468.0" y="506.0" text-anchor="middle"><tspan class="mono">deferred_to_trusted</tspan></text>
  <rect class="halt" x="668.0" y="432.0" width="300.0" height="102.0" rx="6"/>
  <text x="818.0" y="463.0" text-anchor="middle" class="title on-halt">The run ends</text>
  <text x="818.0" y="485.0" text-anchor="middle"><tspan class="mono on-halt">HaltRun</tspan><tspan class="small on-halt">: </tspan><tspan class="mono on-halt">halted</tspan><tspan class="small on-halt">,</tspan></text>
  <text x="818.0" y="506.0" text-anchor="middle" class="small on-halt">always flagged</text>
  <path class="edge" d="M468.0,356.0 L468.0,430.0" marker-end="url(#arrow)"/>
  <path class="edge" d="M468.0,404.0 L818.0,404.0 L818.0,430.0" marker-end="url(#arrow)"/>
  <text x="482.0" y="392.0" text-anchor="start"><tspan class="small">none passes: the </tspan><tspan class="mono">fallback</tspan><tspan class="small"> writes it</tspan></text>
  <text x="32.0" y="578.0" text-anchor="start"><tspan class="small">One record keeps every sample, flagged when its lowest score is at or above </tspan><tspan class="mono">audit_threshold</tspan><tspan class="small">.</tspan></text>
</svg>
