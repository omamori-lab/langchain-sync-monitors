<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="902" viewBox="0 0 1000 902" role="img" aria-labelledby="title desc">
  <title id="title">How a guard model&#x27;s labels become a score</title>
  <desc id="desc">GuardMonitor asks the guard model for samples replies to the same prompt, 5 by default: one after another under invoke(), at once under ainvoke(). Each reply&#x27;s label is read where the guard&#x27;s format puts it. When more than half the samples answered and every reply holds a readable label, suspicion is the share of the replies labelled suspicious. A reply with no readable label, an ambiguous one, one cut off at a length limit, a refusal or a rejection fails the whole rating closed at 1.0. A sample the model left unanswered, such as one whose rate limit outlasted the retries, is set aside; when at most half the samples answered, the rating fails closed at 1.0. With samples=1 every score is 0 or 1, and building the monitor warns with HardLabelWarning.</desc>
  <!-- Colours come from the brand tokens: diagrams/render.py fills this style block. -->
  <style>
    svg { color-scheme: light; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "Noto Sans JP", Helvetica, Arial, sans-serif; font-size: 15px; fill: #111111; }
    .title { font-size: 17px; font-weight: 600; }
    .small { font-size: 14px; fill: #5B5B57; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13.5px; }
    .soft { fill: #5B5B57; }
    .dashed { stroke-dasharray: 5 4; fill: none; stroke: #9A9A94; }
    .box { fill: #FFFFFF; stroke: #111111; stroke-width: 1.4; }
    .charm { fill: #111111; }
    .on-charm { fill: #FFFFFF; }
    .charm-cord { fill: none; stroke: #111111; stroke-width: 2.2; }
    .seal { fill: #BF3A22; }
    .allow { fill: #FFFFFF; stroke: #111111; stroke-width: 1.4; }
    .resample { fill: #F2F1EC; stroke: #111111; stroke-width: 1.4; }
    .defer { fill: #DCDBD4; stroke: #111111; stroke-width: 1.4; }
    .steer { fill: #3A3A38; stroke: #3A3A38; stroke-width: 1.4; }
    .on-steer { fill: #FFFFFF; }
    .halt { fill: #BF3A22; stroke: #BF3A22; stroke-width: 1.4; }
    .on-halt { fill: #FFFFFF; }
    .frame { fill: none; stroke: #9A9A94; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .edge { fill: none; stroke: #2B2B2B; stroke-width: 1.5; }
    .loop { fill: none; stroke: #2B2B2B; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .bold { stroke-width: 2.75; }
    .lifeline { fill: none; stroke: #5B5B57; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .head { fill: #2B2B2B; }
    .brush { fill: #111111; }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker></defs>
  <text x="32.0" y="44.0" text-anchor="start"><tspan class="title">How a guard model&#x27;s labels become a score</tspan></text>
  <text x="32.0" y="70.0" text-anchor="start" class="small">A reply that cannot be read, is cut off, is refused or is rejected fails the whole rating closed at 1.0.</text>
  <rect class="box" x="590.0" y="104.0" width="378.0" height="102.0" rx="6"/>
  <text x="779.0" y="135.0" text-anchor="middle" class="title">All replies readable</text>
  <text x="779.0" y="157.0" text-anchor="middle" class="small">suspicion: the share labelled suspicious,</text>
  <text x="779.0" y="178.0" text-anchor="middle" class="small">in steps of 0.2 with the default 5</text>
  <rect class="box" x="590.0" y="220.0" width="378.0" height="102.0" rx="6"/>
  <text x="779.0" y="251.0" text-anchor="middle" class="title">Unreadable, cut off or refused</text>
  <text x="779.0" y="273.0" text-anchor="middle" class="small">or rejected: fails closed at 1.0;</text>
  <text x="779.0" y="294.0" text-anchor="middle" class="small">unanswered set aside while most answered</text>
  <rect class="box" x="590.0" y="336.0" width="378.0" height="102.0" rx="6"/>
  <text x="779.0" y="367.0" text-anchor="middle"><tspan class="mono">samples = 1</tspan></text>
  <text x="779.0" y="389.0" text-anchor="middle" class="small">every score is 0 or 1, and building</text>
  <text x="779.0" y="410.0" text-anchor="middle" class="small">warns with HardLabelWarning</text>
  <rect class="box" x="304.0" y="220.0" width="250.0" height="102.0" rx="6"/>
  <text x="429.0" y="251.0" text-anchor="middle" class="title">Draw samples replies</text>
  <text x="429.0" y="273.0" text-anchor="middle" class="small">one after another under invoke(),</text>
  <text x="429.0" y="294.0" text-anchor="middle" class="small">at once under ainvoke()</text>
  <rect class="box" x="32.0" y="220.0" width="240.0" height="102.0" rx="6"/>
  <text x="152.0" y="251.0" text-anchor="middle" class="title">Sampling, the default</text>
  <text x="152.0" y="273.0" text-anchor="middle"><tspan class="mono">top_log_probabilities=0</tspan></text>
  <text x="152.0" y="294.0" text-anchor="middle" class="small">samples calls, 5 by default</text>
  <path class="edge" d="M272.0,271.0 L302.0,271.0" marker-end="url(#arrow)"/>
  <path class="edge" d="M554.0,271.0 L574.0,271.0"/>
  <path class="edge" d="M574.0,155.0 L574.0,387.0"/>
  <path class="edge" d="M574.0,155.0 L588.0,155.0" marker-end="url(#arrow)"/>
  <path class="edge" d="M574.0,271.0 L588.0,271.0" marker-end="url(#arrow)"/>
  <path class="edge" d="M574.0,387.0 L588.0,387.0" marker-end="url(#arrow)"/>
  <rect class="box" x="590.0" y="486.0" width="378.0" height="102.0" rx="6"/>
  <text x="779.0" y="517.0" text-anchor="middle" class="title">A label to score</text>
  <text x="779.0" y="539.0" text-anchor="middle" class="small">suspicion: probability on suspicious labels</text>
  <text x="779.0" y="560.0" text-anchor="middle" class="small">over total label probability</text>
  <rect class="box" x="590.0" y="602.0" width="378.0" height="102.0" rx="6"/>
  <text x="779.0" y="633.0" text-anchor="middle" class="title">Unreadable, cut off or refused</text>
  <text x="779.0" y="655.0" text-anchor="middle" class="small">or no alternatives: fails closed at 1.0,</text>
  <text x="779.0" y="676.0" text-anchor="middle" class="small">the cause given as evidence</text>
  <rect class="box" x="590.0" y="718.0" width="378.0" height="102.0" rx="6"/>
  <text x="779.0" y="749.0" text-anchor="middle" class="title">Rejection of logprobs</text>
  <text x="779.0" y="771.0" text-anchor="middle" class="small">ConfigurationError naming the model:</text>
  <text x="779.0" y="792.0" text-anchor="middle" class="small">the step fails</text>
  <rect class="box" x="304.0" y="602.0" width="250.0" height="102.0" rx="6"/>
  <text x="429.0" y="633.0" text-anchor="middle" class="title">Score token alternatives</text>
  <text x="429.0" y="655.0" text-anchor="middle" class="small">at the label&#x27;s first token:</text>
  <text x="429.0" y="676.0" text-anchor="middle" class="small">weighs alternatives of each kind</text>
  <rect class="box" x="32.0" y="602.0" width="240.0" height="102.0" rx="6"/>
  <text x="152.0" y="633.0" text-anchor="middle" class="title">Log-probabilities</text>
  <text x="152.0" y="655.0" text-anchor="middle"><tspan class="mono">top_log_probabilities&gt;0</tspan></text>
  <text x="152.0" y="676.0" text-anchor="middle" class="small">1 call, samples unused</text>
  <path class="edge" d="M272.0,653.0 L302.0,653.0" marker-end="url(#arrow)"/>
  <path class="edge" d="M554.0,653.0 L574.0,653.0"/>
  <path class="edge" d="M574.0,537.0 L574.0,769.0"/>
  <path class="edge" d="M574.0,537.0 L588.0,537.0" marker-end="url(#arrow)"/>
  <path class="edge" d="M574.0,653.0 L588.0,653.0" marker-end="url(#arrow)"/>
  <path class="edge" d="M574.0,769.0 L588.0,769.0" marker-end="url(#arrow)"/>
  <text x="32.0" y="860.0" text-anchor="start" class="small">A sample left unanswered is set aside while more than half answered; otherwise the rating fails closed at 1.0.</text>
</svg>
