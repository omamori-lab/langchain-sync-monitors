<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">A monitor for every subagent: a copy or an override</title>
  <desc id="desc">monitor_subagents gives each subagent of a Deep Agent a monitor of its own. The main agent&#x27;s monitor, monitor[main], judges each of the main agent&#x27;s steps, the task call that delegates work included, and each task call starts a subagent. In this example the analyst&#x27;s monitor, monitor[analyst], is a copy of the main monitor. The publisher&#x27;s, monitor[publisher], is a copy of its entry in overrides, so it keeps that entry&#x27;s own protocol and options. The general-purpose subagent&#x27;s, monitor[general-purpose], is a copy of the main monitor, and monitor_subagents adds that subagent when no spec you pass is named general-purpose. Every copy is named after its subagent and reads the delegated task as the parent agent&#x27;s words, not the user&#x27;s. When a task returns, the subagent&#x27;s records, halts included, join the main agent&#x27;s monitor_log.</desc>
