<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="664" viewBox="0 0 1000 664" role="img" aria-labelledby="title desc">
  <title id="title">Choose a protocol in three questions</title>
  <desc id="desc">Three questions choose one of the four control protocols. First, stop suspicious steps, or only flag them for a person to review? To only flag them, use Trusted Monitoring. To stop them, ask second: tell a blocked agent why, so it can take a safer route? If yes, use Auto Mode. If the agent should not learn what the monitor catches, ask third: pay for up to two more samples of a suspicious step? If yes, use Defer to Resample; if no, use Defer to Trusted.</desc>
  <!-- Colours come from the brand tokens: diagrams/render.py fills this style block. -->
  <style>
    svg { color-scheme: dark; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "Noto Sans JP", Helvetica, Arial, sans-serif; font-size: 15px; fill: #ECEBE6; }
    .title { font-size: 17px; font-weight: 600; }
    .small { font-size: 14px; fill: #A9A8A2; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13.5px; }
    .soft { fill: #A9A8A2; }
    .dashed { stroke-dasharray: 5 4; fill: none; stroke: #6A6A66; }
    .box { fill: #141414; stroke: #ECEBE6; stroke-width: 1.4; }
    .charm { fill: #ECEBE6; }
    .on-charm { fill: #111111; }
    .charm-cord { fill: none; stroke: #ECEBE6; stroke-width: 2.2; }
    .seal { fill: #E0563B; }
    .allow { fill: #141414; stroke: #ECEBE6; stroke-width: 1.4; }
    .resample { fill: #1F1F1E; stroke: #ECEBE6; stroke-width: 1.4; }
    .defer { fill: #34332F; stroke: #ECEBE6; stroke-width: 1.4; }
    .steer { fill: #D9D8D2; stroke: #D9D8D2; stroke-width: 1.4; }
    .on-steer { fill: #111111; }
    .halt { fill: #E0563B; stroke: #E0563B; stroke-width: 1.4; }
    .on-halt { fill: #111111; }
    .frame { fill: none; stroke: #6A6A66; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .edge { fill: none; stroke: #D6D5CF; stroke-width: 1.5; }
    .loop { fill: none; stroke: #D6D5CF; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .head { fill: #D6D5CF; }
    .brush { fill: #ECEBE6; }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker></defs>
  <text x="32.0" y="44.0" text-anchor="start"><tspan class="title">Choose a protocol in three questions</tspan></text>
  <rect class="box" x="32.0" y="96.0" width="330.0" height="102.0" rx="6"/>
  <text x="197.0" y="127.0" text-anchor="middle" class="title">Stop, or only flag?</text>
  <text x="197.0" y="149.0" text-anchor="middle" class="small">stop suspicious steps, or only</text>
  <text x="197.0" y="170.0" text-anchor="middle" class="small">flag them for a person to review</text>
  <rect class="box" x="668.0" y="96.0" width="300.0" height="102.0" rx="6"/>
  <text x="818.0" y="127.0" text-anchor="middle" class="title">Trusted Monitoring</text>
  <text x="818.0" y="149.0" text-anchor="middle" class="mono">TrustedMonitoring</text>
  <text x="818.0" y="170.0" text-anchor="middle" class="small">flags a step, never stops it</text>
  <rect class="box" x="32.0" y="274.0" width="330.0" height="102.0" rx="6"/>
  <text x="197.0" y="305.0" text-anchor="middle" class="title">Tell the agent why?</text>
  <text x="197.0" y="327.0" text-anchor="middle" class="small">tell a blocked agent why, so</text>
  <text x="197.0" y="348.0" text-anchor="middle" class="small">it can take a safer route</text>
  <rect class="box" x="668.0" y="274.0" width="300.0" height="102.0" rx="6"/>
  <text x="818.0" y="305.0" text-anchor="middle" class="title">Auto Mode</text>
  <text x="818.0" y="327.0" text-anchor="middle" class="mono">AutoMode</text>
  <text x="818.0" y="348.0" text-anchor="middle" class="small">blocks, says why, lets it retry</text>
  <rect class="box" x="32.0" y="467.0" width="330.0" height="102.0" rx="6"/>
  <text x="197.0" y="498.0" text-anchor="middle" class="title">Resample first?</text>
  <text x="197.0" y="520.0" text-anchor="middle" class="small">pay for up to two more</text>
  <text x="197.0" y="541.0" text-anchor="middle" class="small">samples of a suspicious step</text>
  <rect class="box" x="668.0" y="404.0" width="300.0" height="102.0" rx="6"/>
  <text x="818.0" y="435.0" text-anchor="middle" class="title">Defer to Resample</text>
  <text x="818.0" y="457.0" text-anchor="middle" class="mono">DeferToResample</text>
  <text x="818.0" y="478.0" text-anchor="middle" class="small">samples again before deferring</text>
  <rect class="box" x="668.0" y="530.0" width="300.0" height="102.0" rx="6"/>
  <text x="818.0" y="561.0" text-anchor="middle" class="title">Defer to Trusted</text>
  <text x="818.0" y="583.0" text-anchor="middle" class="mono">DeferToTrusted</text>
  <text x="818.0" y="604.0" text-anchor="middle" class="small">the trusted model writes it</text>
  <path class="edge" d="M362.0,147.0 L666.0,147.0" marker-end="url(#arrow)"/>
  <text x="515.0" y="135.0" text-anchor="middle" class="small">only flag them</text>
  <path class="edge" d="M362.0,325.0 L666.0,325.0" marker-end="url(#arrow)"/>
  <text x="515.0" y="313.0" text-anchor="middle" class="small">yes</text>
  <path class="edge" d="M362.0,518.0 L400.0,518.0"/>
  <path class="edge" d="M400.0,455.0 L400.0,581.0"/>
  <path class="edge" d="M400.0,455.0 L666.0,455.0" marker-end="url(#arrow)"/>
  <path class="edge" d="M400.0,581.0 L666.0,581.0" marker-end="url(#arrow)"/>
  <text x="534.0" y="443.0" text-anchor="middle" class="small">yes</text>
  <text x="534.0" y="569.0" text-anchor="middle" class="small">no</text>
  <path class="edge" d="M88.0,198.0 L88.0,272.0" marker-end="url(#arrow)"/>
  <text x="102.0" y="241.0" text-anchor="start" class="small">stop them</text>
  <path class="edge" d="M88.0,376.0 L88.0,465.0" marker-end="url(#arrow)"/>
  <text x="102.0" y="415.5" text-anchor="start" class="small">no: it should not learn</text>
  <text x="102.0" y="437.5" text-anchor="start" class="small">what the monitor catches</text>
</svg>
