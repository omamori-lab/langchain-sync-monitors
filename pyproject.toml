[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=25.1"]
build-backend = "hatchling.build"

[project]
name = "langchain-sync-monitors"
dynamic = ["version", "readme"]
description = "AI-control monitors for LangChain agents and Deep Agents: every step an agent proposes is judged before any of its own tools run, and a control protocol decides what runs."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Antonio Badilla-Olivas", email = "omamori-lab@proton.me" }]
keywords = [
    "ai-safety",
    "ai-control",
    "langchain",
    "langgraph",
    "deepagents",
    "ai-agents",
    "llm-agents",
    "agent-safety",
    "monitoring",
    "guardrails",
    "prompt-injection",
    "llm-security",
    "middleware",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "langchain>=1.4",
    "langchain-core>=1.6",
    "langgraph>=1.2.11",
    "pydantic>=2.12",
    "httpx>=0.27",
    "stamina>=25.1",
]

[project.optional-dependencies]
deepagents = ["deepagents>=0.7.13"]
openrouter = ["langchain-openrouter>=0.2.1"]
typesafe = ["langchain-typesafe>=0.0.1a3"]

[project.urls]
Homepage = "https://omamori-lab.github.io/langchain-sync-monitors/"
Documentation = "https://omamori-lab.github.io/langchain-sync-monitors/"
Repository = "https://github.com/omamori-lab/langchain-sync-monitors"
Issues = "https://github.com/omamori-lab/langchain-sync-monitors/issues"
Changelog = "https://github.com/omamori-lab/langchain-sync-monitors/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.15",
    "ty>=0.0.84",
    "bibtexparser>=2.0.1,<3",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    "mkdocs-bibtex>=4",
    "mkdocs-redirects>=1.2",
]

[tool.hatch.version]
path = "src/langchain_sync_monitors/__init__.py"

# The README links images and pages by relative path, which GitHub resolves.
# PyPI does not, so the package description gets absolute URLs at build time:
# raw files for the diagrams, repository pages for links. The URLs name the
# release tag, v$HFPR_VERSION, so a release's PyPI page keeps showing the files
# it was released with. PyPI drops the <source> of each <picture>, so it shows
# the light variant of every diagram.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(src|srcset)="(docs/assets/[^"]+)"'
replacement = '\1="https://raw.githubusercontent.com/omamori-lab/langchain-sync-monitors/v$HFPR_VERSION/\2"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#|mailto:)([^)\s]+)\)'
replacement = '](https://github.com/omamori-lab/langchain-sync-monitors/blob/v$HFPR_VERSION/\1)'

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_sync_monitors"]

[tool.hatch.build.targets.sdist]
# An explicit list, because hatchling ships every file .gitignore does not
# exclude, tracked or not. The docs travel with the tests that check their
# citations; the plans are working notes and stay in the repository, as do the
# GitHub templates, the agent files and the release scripts.
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CITATION.cff",
    "/pyproject.toml",
]
exclude = ["/docs/plans"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C90", "ANN", "PT", "RUF", "COM"]
ignore = ["COM812"]

[tool.ruff.lint.mccabe]
# The highest complexity lanorme's complexity_error allows, so tests, which lanorme skips,
# keep to the same number. Ruff leaves out `with`, `assert` and each extra boolean operand,
# which lanorme counts, so here the same number is a looser limit.
max-complexity = 6

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN401"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
unused-ignore-comment = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls real model providers; needs OPENROUTER_API_KEY and spends credits"]
addopts = "-m 'not live'"

# The limits below are a ratchet: lower them as the code allows, and raise one only in a
# reviewed change that says why.
[tool.lanorme]
# lanorme takes the outermost directory with a config as the project root. In an agent
# worktree under .claude/worktrees that is the main checkout, whose exclude then drops
# every file of the worktree. `root = true` makes each checkout its own project, and the
# main checkout excludes only the worktrees, so the tracked .claude files are checked.
# lanorme does not read .gitignore, so a local run also checks untracked files that CI
# never sees, such as notes under .claude or CLAUDE.local.md.
root = true
ignore = ["LAYER", "PORT", "TERM"]
promote = ["NAMING-006", "NAMING-007", "NAMING-008", "NAMING-011", "SIMILAR-001"]
exclude = [
    ".venv/*",
    ".claude/worktrees",
    ".claude/worktrees/*",
    "dist/*",
    "site/*",
    "docs/plans/*",
]

[tool.lanorme.file_limits]
func_warn_lines = 40
func_error_lines = 60
complexity_warn = 6
# One above the most complex function today.
complexity_error = 7
param_warn = 5
param_error = 8

[tool.lanorme.prose]
enabled = true

[tool.lanorme.comments]
em_dash = true
emoji = true

[tool.lanorme.named_args]
enabled = true

[tool.lanorme.test_style]
enabled = true

[tool.lanorme.attribute_access]
enabled = true

[tool.lanorme.naming_clean_code]
enabled = true

[tool.lanorme.similarity]
enabled = true

# Each inline ignore of a lanorme rule counts, as `# lanorme: ignore[...]` or `# noqa`.
[tool.lanorme.suppressions]
enabled = true
max_total = 20

# The restating check (CMT-005) stays off: it reads each test's required `# Assert` marker
# as a comment that restates the `assert` below it.

[tool.lanorme.docs]
enabled = true

[tool.lanorme.docstrings]
enabled = true
