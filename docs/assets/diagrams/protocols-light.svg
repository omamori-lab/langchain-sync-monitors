<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="836" viewBox="0 0 1000 836" role="img" aria-labelledby="title desc">
  <title id="title">The four control protocols</title>
  <desc id="desc">What each protocol does with a step the monitor finds suspicious; a step below the threshold runs unchanged under every protocol. Trusted Monitoring lets the step run and flags it for a person to review. Defer to Trusted has the trusted model write the step instead. Defer to Resample draws up to two fresh samples; if one passes, the least suspicious runs, and if none passes, the fallback writes the step, usually the trusted model. Auto Mode blocks the step and tells the agent why, and the agent tries again; after three blocks in a row, or twenty in the thread with subagents&#x27; blocks included, the fallback takes over, which by default halts the run.</desc>
  <!-- Colours come from the brand tokens: diagrams/render.py fills this style block. -->
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "Noto Sans JP", Helvetica, Arial, sans-serif; font-size: 15px; fill: #111111; }
    .title { font-size: 17px; font-weight: 600; }
    .small { font-size: 14px; fill: #5B5B57; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13.5px; }
    .soft { fill: #5B5B57; }
    .dashed { stroke-dasharray: 5 4; fill: none; stroke: #9A9A94; }
    .box { fill: #FFFFFF; stroke: #111111; stroke-width: 1.4; }
    .charm { fill: #111111; }
    .on-charm { fill: #FFFFFF; }
    .charm-cord { fill: none; stroke: #111111; stroke-width: 2.2; }
    .seal { fill: #BF3A22; }
    .allow { fill: #FFFFFF; stroke: #111111; stroke-width: 1.4; }
    .resample { fill: #F2F1EC; stroke: #111111; stroke-width: 1.4; }
    .defer { fill: #DCDBD4; stroke: #111111; stroke-width: 1.4; }
    .steer { fill: #3A3A38; stroke: #3A3A38; stroke-width: 1.4; }
    .on-steer { fill: #FFFFFF; }
    .halt { fill: #BF3A22; stroke: #BF3A22; stroke-width: 1.4; }
    .on-halt { fill: #FFFFFF; }
    .frame { fill: none; stroke: #9A9A94; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .edge { fill: none; stroke: #2B2B2B; stroke-width: 1.5; }
    .loop { fill: none; stroke: #2B2B2B; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .head { fill: #2B2B2B; }
    .brush { fill: #111111; }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker></defs>
  <text x="32.0" y="44.0" text-anchor="start"><tspan class="title">What each protocol does with a suspicious step</tspan></text>
  <text x="32.0" y="70.0" text-anchor="start" class="small">A step scored below the threshold runs unchanged under every protocol.</text>
  <rect class="box" x="32.0" y="100.0" width="262.0" height="102.0" rx="6"/>
  <text x="163.0" y="131.0" text-anchor="middle" class="title">Trusted Monitoring</text>
  <text x="163.0" y="153.0" text-anchor="middle" class="mono">TrustedMonitoring</text>
  <text x="163.0" y="174.0" text-anchor="middle" class="small">from AI Control</text>
  <rect class="allow" x="348.0" y="110.5" width="262.0" height="81.0" rx="6"/>
  <text x="479.0" y="141.5" text-anchor="middle" class="title">The step runs</text>
  <text x="479.0" y="163.5" text-anchor="middle" class="small">unchanged</text>
  <rect class="box" x="686.0" y="110.5" width="282.0" height="81.0" rx="6"/>
  <text x="827.0" y="141.5" text-anchor="middle" class="title">Flagged</text>
  <text x="827.0" y="163.5" text-anchor="middle" class="small">for a person to review</text>
  <path class="edge" d="M294.0,151.0 L346.0,151.0" marker-end="url(#arrow)"/>
  <path class="edge" d="M610.0,151.0 L684.0,151.0" marker-end="url(#arrow)"/>
  <rect class="box" x="32.0" y="230.0" width="262.0" height="102.0" rx="6"/>
  <text x="163.0" y="261.0" text-anchor="middle" class="title">Defer to Trusted</text>
  <text x="163.0" y="283.0" text-anchor="middle" class="mono">DeferToTrusted</text>
  <text x="163.0" y="304.0" text-anchor="middle" class="small">from AI Control</text>
  <rect class="defer" x="348.0" y="240.5" width="620.0" height="81.0" rx="6"/>
  <text x="658.0" y="271.5" text-anchor="middle" class="title">Defer to trusted</text>
  <text x="658.0" y="293.5" text-anchor="middle" class="small">the trusted model writes the step instead</text>
  <path class="edge" d="M294.0,281.0 L346.0,281.0" marker-end="url(#arrow)"/>
  <rect class="box" x="32.0" y="400.0" width="262.0" height="102.0" rx="6"/>
  <text x="163.0" y="431.0" text-anchor="middle" class="title">Defer to Resample</text>
  <text x="163.0" y="453.0" text-anchor="middle" class="mono">DeferToResample</text>
  <text x="163.0" y="474.0" text-anchor="middle" class="small">from Ctrl-Z</text>
  <rect class="resample" x="348.0" y="410.5" width="262.0" height="81.0" rx="6"/>
  <text x="479.0" y="441.5" text-anchor="middle" class="title">Resample</text>
  <text x="479.0" y="463.5" text-anchor="middle" class="small">up to 2 fresh samples</text>
  <rect class="allow" x="686.0" y="339.0" width="282.0" height="102.0" rx="6"/>
  <text x="827.0" y="370.0" text-anchor="middle" class="title">One passes</text>
  <text x="827.0" y="392.0" text-anchor="middle" class="small">the least suspicious</text>
  <text x="827.0" y="413.0" text-anchor="middle" class="small">sample runs</text>
  <rect class="defer" x="686.0" y="461.0" width="282.0" height="102.0" rx="6"/>
  <text x="827.0" y="492.0" text-anchor="middle" class="title">None passes</text>
  <text x="827.0" y="514.0" text-anchor="middle" class="small">the fallback writes it,</text>
  <text x="827.0" y="535.0" text-anchor="middle" class="small">usually the trusted model</text>
  <path class="edge" d="M294.0,451.0 L346.0,451.0" marker-end="url(#arrow)"/>
  <path class="edge" d="M610.0,451.0 L648.0,451.0"/>
  <path class="edge" d="M648.0,390.0 L648.0,512.0"/>
  <path class="edge" d="M648.0,390.0 L684.0,390.0" marker-end="url(#arrow)"/>
  <path class="edge" d="M648.0,512.0 L684.0,512.0" marker-end="url(#arrow)"/>
  <rect class="box" x="32.0" y="641.0" width="262.0" height="102.0" rx="6"/>
  <text x="163.0" y="672.0" text-anchor="middle" class="title">Auto Mode</text>
  <text x="163.0" y="694.0" text-anchor="middle" class="mono">AutoMode</text>
  <text x="163.0" y="715.0" text-anchor="middle" class="small">from Claude Code&#x27;s auto mode</text>
  <rect class="steer" x="348.0" y="651.5" width="262.0" height="81.0" rx="6"/>
  <text x="479.0" y="682.5" text-anchor="middle" class="title on-steer">Block and steer</text>
  <text x="479.0" y="704.5" text-anchor="middle" class="small on-steer">the agent is told why</text>
  <rect class="allow" x="686.0" y="580.0" width="282.0" height="102.0" rx="6"/>
  <text x="827.0" y="611.0" text-anchor="middle" class="title">Next try passes</text>
  <text x="827.0" y="633.0" text-anchor="middle" class="small">the new attempt</text>
  <text x="827.0" y="654.0" text-anchor="middle" class="small">runs</text>
  <rect class="halt" x="686.0" y="702.0" width="282.0" height="102.0" rx="6"/>
  <text x="827.0" y="733.0" text-anchor="middle" class="title on-halt">Limit reached</text>
  <text x="827.0" y="755.0" text-anchor="middle" class="small on-halt">3 in a row, or 20 in the thread:</text>
  <text x="827.0" y="776.0" text-anchor="middle" class="small on-halt">the fallback, a halt by default</text>
  <path class="edge" d="M294.0,692.0 L346.0,692.0" marker-end="url(#arrow)"/>
  <path class="edge" d="M610.0,692.0 L648.0,692.0"/>
  <path class="edge" d="M648.0,631.0 L648.0,753.0"/>
  <path class="edge" d="M648.0,631.0 L684.0,631.0" marker-end="url(#arrow)"/>
  <path class="edge" d="M648.0,753.0 L684.0,753.0" marker-end="url(#arrow)"/>
  <path class="loop" d="M523.0,732.5 L523.0,762.5 L435.0,762.5 L435.0,734.5" marker-end="url(#arrow)"/>
  <text x="479.0" y="786.5" text-anchor="middle" class="small">suspicious again: blocked again</text>
</svg>
