<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1125" viewBox="0 0 1000 1125" role="img" aria-labelledby="title desc">
  <title id="title">How a guard model&#x27;s labels become a score</title>
  <desc id="desc">GuardModelMonitor has four scoring modes. AUTO, the default, asks for log-probabilities on the first reply. If they give a label to score, suspicion is the probability of a suspicious label at the label&#x27;s first token. If no log-probabilities came back, the reply holds no label to score, or it was cut off, AUTO samples instead: samples minus 1 more replies, and suspicion is the share of all the replies labelled suspicious, the first included. LOG_PROBABILITIES asks for them too and scores the same way. When no log-probabilities with alternatives come back, it raises ConfigurationError, so the step fails; when they come back but give no label to score, or the reply was cut off, it fails closed at 1.0 with a warning in the log. Under both, a chat model that refuses the request for log-probabilities raises ConfigurationError naming SAMPLE_FRACTION. SAMPLE_FRACTION draws samples replies, 5 by default, and suspicion is the share labelled suspicious. HARD_LABEL reads one reply as 1.0 or 0.0, and warns when the monitor is built. A sampled reply that is cut off, or holds no readable label, counts as a suspicious label. A call that still fails after the chat model&#x27;s own retries, and after the monitor&#x27;s own retries of a rate limit, raises its error, and the step fails.</desc>
  <!-- Colours come from the brand tokens: diagrams/render.py fills this style block. -->
  <style>
    svg { color-scheme: dark; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "Noto Sans JP", Helvetica, Arial, sans-serif; font-size: 15px; fill: #ECEBE6; }
    .title { font-size: 17px; font-weight: 600; }
    .small { font-size: 14px; fill: #A9A8A2; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13.5px; }
    .soft { fill: #A9A8A2; }
    .dashed { stroke-dasharray: 5 4; fill: none; stroke: #6A6A66; }
    .box { fill: #141414; stroke: #ECEBE6; stroke-width: 1.4; }
    .charm { fill: #ECEBE6; }
    .on-charm { fill: #111111; }
    .charm-cord { fill: none; stroke: #ECEBE6; stroke-width: 2.2; }
    .seal { fill: #E0563B; }
    .allow { fill: #141414; stroke: #ECEBE6; stroke-width: 1.4; }
    .resample { fill: #1F1F1E; stroke: #ECEBE6; stroke-width: 1.4; }
    .defer { fill: #34332F; stroke: #ECEBE6; stroke-width: 1.4; }
    .steer { fill: #D9D8D2; stroke: #D9D8D2; stroke-width: 1.4; }
    .on-steer { fill: #111111; }
    .halt { fill: #E0563B; stroke: #E0563B; stroke-width: 1.4; }
    .on-halt { fill: #111111; }
    .frame { fill: none; stroke: #6A6A66; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .edge { fill: none; stroke: #D6D5CF; stroke-width: 1.5; }
    .loop { fill: none; stroke: #D6D5CF; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .head { fill: #D6D5CF; }
    .brush { fill: #ECEBE6; }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker></defs>
  <text x="32.0" y="44.0" text-anchor="start"><tspan class="title">How a guard model&#x27;s labels become a score</tspan></text>
  <text x="32.0" y="70.0" text-anchor="start" class="small">A sampled reply that is cut off, or holds no readable label, counts as a suspicious label.</text>
  <rect class="box" x="596.0" y="100.0" width="372.0" height="81.0" rx="6"/>
  <text x="782.0" y="131.0" text-anchor="middle" class="title">A label to score</text>
  <text x="782.0" y="153.0" text-anchor="middle" class="small">suspicion: the chance of a suspicious label</text>
  <rect class="box" x="596.0" y="195.0" width="372.0" height="102.0" rx="6"/>
  <text x="782.0" y="226.0" text-anchor="middle" class="title">Nothing to score, or cut off</text>
  <text x="782.0" y="248.0" text-anchor="middle"><tspan class="small">sample instead: </tspan><tspan class="mono">samples - 1</tspan><tspan class="small"> more replies,</tspan></text>
  <text x="782.0" y="269.0" text-anchor="middle" class="small">the share of all labelled suspicious</text>
  <rect class="box" x="596.0" y="311.0" width="372.0" height="102.0" rx="6"/>
  <text x="782.0" y="342.0" text-anchor="middle" class="title">The model refuses the request</text>
  <text x="782.0" y="364.0" text-anchor="middle"><tspan class="mono">ConfigurationError</tspan><tspan class="small"> naming</tspan></text>
  <text x="782.0" y="385.0" text-anchor="middle"><tspan class="mono">SAMPLE_FRACTION</tspan><tspan class="small">: the step fails</tspan></text>
  <rect class="box" x="296.0" y="205.5" width="240.0" height="81.0" rx="6"/>
  <text x="416.0" y="236.5" text-anchor="middle" class="title">First reply</text>
  <text x="416.0" y="258.5" text-anchor="middle" class="small">log-probabilities requested</text>
  <rect class="box" x="32.0" y="195.0" width="220.0" height="102.0" rx="6"/>
  <text x="142.0" y="226.0" text-anchor="middle" class="title">Auto, the default</text>
  <text x="142.0" y="248.0" text-anchor="middle"><tspan class="mono">AUTO</tspan></text>
  <text x="142.0" y="269.0" text-anchor="middle"><tspan class="small">1 call, or </tspan><tspan class="mono">samples</tspan></text>
  <path class="edge" d="M252.0,246.0 L294.0,246.0" marker-end="url(#arrow)"/>
  <path class="edge" d="M536.0,246.0 L566.0,246.0"/>
  <path class="edge" d="M566.0,140.5 L566.0,362.0"/>
  <path class="edge" d="M566.0,140.5 L594.0,140.5" marker-end="url(#arrow)"/>
  <path class="edge" d="M566.0,246.0 L594.0,246.0" marker-end="url(#arrow)"/>
  <path class="edge" d="M566.0,362.0 L594.0,362.0" marker-end="url(#arrow)"/>
  <rect class="box" x="596.0" y="461.0" width="372.0" height="81.0" rx="6"/>
  <text x="782.0" y="492.0" text-anchor="middle" class="title">A label to score</text>
  <text x="782.0" y="514.0" text-anchor="middle" class="small">suspicion: the chance of a suspicious label</text>
  <rect class="box" x="596.0" y="556.0" width="372.0" height="102.0" rx="6"/>
  <text x="782.0" y="587.0" text-anchor="middle" class="title">Returned, but nothing to score</text>
  <text x="782.0" y="609.0" text-anchor="middle" class="small">no label to score, or the reply cut off:</text>
  <text x="782.0" y="630.0" text-anchor="middle" class="small">fails closed: 1.0, and a warning in the log</text>
  <rect class="box" x="596.0" y="672.0" width="372.0" height="81.0" rx="6"/>
  <text x="782.0" y="703.0" text-anchor="middle" class="title">No log-probabilities, or refused</text>
  <text x="782.0" y="725.0" text-anchor="middle"><tspan class="mono">ConfigurationError</tspan><tspan class="small">: the step fails</tspan></text>
  <rect class="box" x="296.0" y="566.5" width="240.0" height="81.0" rx="6"/>
  <text x="416.0" y="597.5" text-anchor="middle" class="title">First reply</text>
  <text x="416.0" y="619.5" text-anchor="middle" class="small">log-probabilities requested</text>
  <rect class="box" x="32.0" y="556.0" width="220.0" height="102.0" rx="6"/>
  <text x="142.0" y="587.0" text-anchor="middle" class="title">Log-probabilities</text>
  <text x="142.0" y="609.0" text-anchor="middle"><tspan class="mono">LOG_PROBABILITIES</tspan></text>
  <text x="142.0" y="630.0" text-anchor="middle" class="small">1 call</text>
  <path class="edge" d="M252.0,607.0 L294.0,607.0" marker-end="url(#arrow)"/>
  <path class="edge" d="M536.0,607.0 L566.0,607.0"/>
  <path class="edge" d="M566.0,501.5 L566.0,712.5"/>
  <path class="edge" d="M566.0,501.5 L594.0,501.5" marker-end="url(#arrow)"/>
  <path class="edge" d="M566.0,607.0 L594.0,607.0" marker-end="url(#arrow)"/>
  <path class="edge" d="M566.0,712.5 L594.0,712.5" marker-end="url(#arrow)"/>
  <rect class="box" x="296.0" y="801.0" width="672.0" height="102.0" rx="6"/>
  <text x="632.0" y="832.0" text-anchor="middle"><tspan class="title">Draw </tspan><tspan class="mono">samples</tspan><tspan class="title"> replies</tspan></text>
  <text x="632.0" y="854.0" text-anchor="middle" class="small">suspicion: the share labelled suspicious,</text>
  <text x="632.0" y="875.0" text-anchor="middle" class="small">in steps of 0.2 with the default 5</text>
  <rect class="box" x="32.0" y="801.0" width="220.0" height="102.0" rx="6"/>
  <text x="142.0" y="832.0" text-anchor="middle" class="title">Sample fraction</text>
  <text x="142.0" y="854.0" text-anchor="middle"><tspan class="mono">SAMPLE_FRACTION</tspan></text>
  <text x="142.0" y="875.0" text-anchor="middle"><tspan class="mono">samples</tspan><tspan class="small"> calls</tspan></text>
  <path class="edge" d="M252.0,852.0 L294.0,852.0" marker-end="url(#arrow)"/>
  <rect class="box" x="32.0" y="951.0" width="220.0" height="102.0" rx="6"/>
  <text x="142.0" y="982.0" text-anchor="middle" class="title">Hard label</text>
  <text x="142.0" y="1004.0" text-anchor="middle"><tspan class="mono">HARD_LABEL</tspan></text>
  <text x="142.0" y="1025.0" text-anchor="middle" class="small">1 call, and a warning</text>
  <rect class="box" x="296.0" y="951.0" width="672.0" height="102.0" rx="6"/>
  <text x="632.0" y="982.0" text-anchor="middle" class="title">Read one reply</text>
  <text x="632.0" y="1004.0" text-anchor="middle" class="small">a suspicious label, or none readable: 1.0</text>
  <text x="632.0" y="1025.0" text-anchor="middle" class="small">a safe label: 0.0</text>
  <path class="edge" d="M252.0,1002.0 L294.0,1002.0" marker-end="url(#arrow)"/>
  <text x="32.0" y="1093.0" text-anchor="start"><tspan class="small">A call that still fails after the chat model&#x27;s own </tspan><tspan class="mono">max_retries</tspan><tspan class="small"> and the monitor&#x27;s retries of an HTTP 429 raises its error, and the step fails.</tspan></text>
</svg>
