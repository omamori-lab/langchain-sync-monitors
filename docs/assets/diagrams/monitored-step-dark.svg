  <path class="edge" d="M685.6,254.0 L685.6,280.0" marker-end="url(#arrow)"/>
  <path class="edge" d="M871.2,254.0 L871.2,280.0" marker-end="url(#arrow)"/>
  <path class="edge" d="M128.8,384.0 L128.8,408.0"/>
