  <path class="edge" d="M685.6,384.0 L685.6,408.0"/>
  <path class="edge" d="M128.8,408.0 L685.6,408.0"/>
  <text x="640.0" y="452.0" text-anchor="middle" class="small">none of the agent&#x27;s tools run above this line</text>
